<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <title>我的收藏夹</title>
</head>
<body>
    <div class="add-box">
        <div style="display: flex;flex-direction: column;width: 100%;gap: 10px;">
            <!-- 上方：图标大小选择、标题和操作按钮 -->
            <div style="display: flex;justify-content: space-between;align-items: center;width: 100%;gap: 15px;">
                <!-- 左侧：图标大小选择 -->
                <div class="icon-size-buttons" style="margin: 0;">
                    <button class="icon-size-btn" id="btnLarge" onclick="setIconSize('large')" title="大图标" data-i18n-title="largeIcon">🔲</button>
                    <button class="icon-size-btn" id="btnMedium" onclick="setIconSize('medium')" title="中图标" data-i18n-title="mediumIcon">◻️</button>
                    <button class="icon-size-btn" id="btnSmall" onclick="setIconSize('small')" title="小图标" data-i18n-title="smallIcon">▪️</button>
                </div>
                
                <!-- 中间：标题 -->
                <div style="display: flex;align-items: center;gap: 8px;">
                    <h2 class="title" id="toolbarTitle" data-i18n="pageTitle" style="font-size: 20px;margin: 0;cursor: default;padding: 8px 15px;border-radius: 6px;transition: background 0.3s;color: #2d3748;flex-shrink: 0;">我的收藏夹</h2>
                </div>
                
                <!-- 右侧：操作按钮 -->
                <div style="display: flex;gap: 8px;flex-shrink: 0;">
                    <button onclick="openAddModal()" class="toolbar-icon-btn" title="添加收藏" data-i18n-title="addBookmark">➕</button>
                    <button onclick="openSettingsModal()" class="toolbar-icon-btn toolbar-settings-btn" title="设置" data-i18n-title="settings">⚙️</button>
                    <button onclick="exportData()" class="toolbar-icon-btn toolbar-export-btn" title="导出数据" data-i18n-title="exportData">📤</button>
                    <button onclick="openImportTypeModal()" class="toolbar-icon-btn toolbar-import-btn" title="导入数据" data-i18n-title="importData">📥</button>
                    <input type="file" id="importFile" accept=".json,.html" style="display:none" onchange="handleImportFile(event)">
                </div>
            </div>
            
            <!-- 下方：语言切换 -->
            <div style="display: flex;justify-content: flex-end;">
                <!-- Language Switcher - Text style -->
                <div class="language-switcher-text">
                    <span class="lang-text" id="langZh" onclick="setLanguage('zh')">中文</span>
                    <span class="lang-separator">|</span>
                    <span class="lang-text" id="langEn" onclick="setLanguage('en')">English</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Tab Container -->
    <div class="tab-container">
        <div class="tab-header" id="tabHeader"></div>
    </div>
    
    <div class="link-grid" id="linkList">
        <div class="empty" data-i18n="noBookmarks">暂无收藏</div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3 data-i18n="editBookmark">编辑收藏</h3>
            <input type="text" class="modal-input" id="editName" placeholder="网址名称（可为空，将自动从网站获取）" data-i18n-placeholder="bookmarkNamePlaceholder">
            <input type="url" class="modal-input" id="editUrl" placeholder="完整网址 https://" data-i18n-placeholder="fullUrlPlaceholder">
            <input type="text" class="modal-input" id="editNote" placeholder="说明" data-i18n-placeholder="notePlaceholder" style="margin-bottom: 20px;">
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeEditModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" id="editBtn" onclick="saveEdit()" data-i18n="save">保存</button>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h3 data-i18n="addBookmark">添加收藏</h3>
            <input type="text" class="modal-input" id="addName" placeholder="网址名称（可为空，将自动从网站获取）" data-i18n-placeholder="bookmarkNameAutoPlaceholder">
            <input type="url" class="modal-input" id="addUrl" placeholder="完整网址 https://" data-i18n-placeholder="fullUrlPlaceholder">
            <input type="text" class="modal-input" id="addNote" placeholder="说明" data-i18n-placeholder="notePlaceholder" style="margin-bottom: 20px;">
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeAddModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" id="addBtn" onclick="saveAddLink()" data-i18n="add">添加</button>
            </div>
        </div>
    </div>

    <!-- Move to Tab Modal -->
    <div class="modal-overlay" id="moveToTabModal">
        <div class="modal">
            <h3 data-i18n="moveToTab">移动到目标选项卡</h3>
            <select class="modal-input" id="targetTabSelect"></select>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeMoveToTabModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" onclick="confirmMoveToTab()" data-i18n="confirm">确定</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>⚙ <span data-i18n="settings">系统设置</span></h3>
            <div style="margin-bottom: 15px;">
                <label style="display: block;margin-bottom: 5px;color: #4a5568;font-weight: bold;" data-i18n="pageTitle">页面标题：</label>
                <input type="text" class="modal-input" id="settingTitle" placeholder="我的收藏夹" style="margin-bottom: 0;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block;margin-bottom: 5px;color: #4a5568;font-weight: bold;" data-i18n="portNumber">端口号：</label>
                <input type="number" class="modal-input" id="settingPort" placeholder="8080" min="1" max="65535" readonly style="margin-bottom: 5px;background-color: #f7fafc;color: #718096;cursor: not-allowed;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block;margin-bottom: 5px;color: #4a5568;font-weight: bold;" data-i18n="copyright">版权信息：</label>
                <input type="text" class="modal-input" id="settingCopyright" placeholder="(c) DSH - MyBookmark" style="margin-bottom: 0;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: flex;align-items: center;gap: 10px;cursor: pointer;">
                    <input type="checkbox" id="settingDebug" style="width: auto;margin: 0;">
                    <span style="color: #4a5568;" data-i18n="debugMode">开启调试模式</span>
                </label>
            </div>
            <div style="background: #fffbeb;border-left: 4px solid #f59e0b;padding: 12px;margin-bottom: 20px;border-radius: 4px;">
                <p style="color: #92400e;font-size: 13px;margin: 0;" data-i18n="restartRequired">
                    ⚠️ <strong>注意：</strong>端口号不可在此修改，如需修改请编辑 config.json 文件并重启服务。
                </p>
            </div>
            <div style="text-align: center;margin-bottom: 15px;display: flex;justify-content: center;gap: 20px;">
                <a href="https://gitee.com/dongatsh/dsh-mybookmark/" target="_blank" style="color: #4299e1;text-decoration: none;font-size: 14px;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
                    Gitee
                </a>
                |
                <a href="https://gitee.com/dongatsh/dsh-mybookmark/issues" target="_blank" style="color: #4299e1;text-decoration: none;font-size: 14px;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
                    Issue
                </a>
            </div>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeSettingsModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" onclick="saveSettings()" data-i18n="save">保存</button>
            </div>
            <div style="text-align: center;margin-top: 15px;color: #a0aec0;font-size: 12px;">
                <span id="settingVersion">v1.0.0</span>
            </div>
        </div>
    </div>

    <!-- Import Type Selection Modal -->
    <div class="modal-overlay" id="importTypeModal">
        <div class="modal" style="max-width: 900px;">
            <h3 data-i18n="importData">导入数据</h3>
            
            <!-- Step 0: Select import method -->
            <div style="margin-bottom: 20px;">
                <label style="display: block;margin-bottom: 10px;font-weight: bold;color: #4a5568;" data-i18n="importMethodLabel">选择导入方式：</label>
                <div style="display: flex;gap: 10px;">
                    <button onclick="setImportMethod('file')" id="importMethodFileBtn" style="flex: 1;padding: 10px;background: #4299e1;color: white;border: none;border-radius: 6px;cursor: pointer;font-size: 14px;transition: all 0.3s;">
                        <span data-i18n="importFromFile">📁 从文件导入</span>
                    </button>
                    <button onclick="setImportMethod('paste')" id="importMethodPasteBtn" style="flex: 1;padding: 10px;background: #e2e8f0;color: #4a5568;border: none;border-radius: 6px;cursor: pointer;font-size: 14px;transition: all 0.3s;">
                        <span data-i18n="importFromText">📋 输入内容</span>
                    </button>
                    <button onclick="setImportMethod('classic')" id="importMethodClassicBtn" style="flex: 1;padding: 10px;background: #e2e8f0;color: #4a5568;border: none;border-radius: 6px;cursor: pointer;font-size: 14px;transition: all 0.3s;">
                        <span data-i18n="classicBookmarks">🌟 经典收藏</span>
                    </button>
                </div>
            </div>
            
            <!-- File Import Section -->
            <div id="fileImportSection">
                <!-- Step 1: Select import type -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block;margin-bottom: 10px;font-weight: bold;color: #4a5568;" data-i18n="importTypeLabel">选择导入类型：</label>
                    <div style="display: flex;flex-direction: column;gap: 10px;">
                        <label style="display: flex;align-items: center;gap: 10px;padding: 12px;border: 2px solid #e2e8f0;border-radius: 8px;cursor: pointer;transition: all 0.3s;" onmouseover="this.style.borderColor='#4299e1';this.style.background='#ebf8ff'" onmouseout="this.style.borderColor='#e2e8f0';this.style.background='white'">
                            <input type="radio" name="importType" value="mybookmark" checked onchange="onImportTypeChange()" style="width: 18px;height: 18px;cursor: pointer;">
                            <span style="font-size: 14px;color: #2d3748;" data-i18n="importMyBookmark">我的收藏夹导出文件</span>
                        </label>
                        <label style="display: flex;align-items: center;gap: 10px;padding: 12px;border: 2px solid #e2e8f0;border-radius: 8px;cursor: pointer;transition: all 0.3s;" onmouseover="this.style.borderColor='#4299e1';this.style.background='#ebf8ff'" onmouseout="this.style.borderColor='#e2e8f0';this.style.background='white'">
                            <input type="radio" name="importType" value="chrome" onchange="onImportTypeChange()" style="width: 18px;height: 18px;cursor: pointer;">
                            <span style="font-size: 14px;color: #2d3748;" data-i18n="importChromeEdge">Chrome/Edge导出文件</span>
                        </label>
                    </div>
                </div>
                
                <!-- Step 2: Select file -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block;margin-bottom: 10px;font-weight: bold;color: #4a5568;" data-i18n="selectFileLabel">选择文件：</label>
                    <button onclick="triggerFileSelect()" style="width: 100%;padding: 12px;background: #4299e1;color: white;border: none;border-radius: 6px;cursor: pointer;font-size: 14px;transition: background 0.3s;" onmouseover="this.style.background='#3182ce'" onmouseout="this.style.background='#4299e1'">
                        <span data-i18n="clickToSelectFile">📁 点击选择文件</span>
                    </button>
                    <div id="selectedFileName" style="margin-top: 8px;padding: 8px;background: #f7fafc;border-radius: 4px;font-size: 13px;color: #4a5568;display: none;word-break: break-all;">
                    </div>
                </div>
            </div>
            
            <!-- Paste Content Section -->
            <div id="pasteImportSection" style="display: none;">
                <div style="margin-bottom: 20px;">
                    <label style="display: block;margin-bottom: 10px;font-weight: bold;color: #4a5568;" data-i18n="selectContentType">选择内容类型：</label>
                    <div style="display: flex;flex-direction: column;gap: 10px;">
                        <label style="display: flex;align-items: center;gap: 10px;padding: 12px;border: 2px solid #e2e8f0;border-radius: 8px;cursor: pointer;transition: all 0.3s;" onmouseover="this.style.borderColor='#4299e1';this.style.background='#ebf8ff'" onmouseout="this.style.borderColor='#e2e8f0';this.style.background='white'">
                            <input type="radio" name="pasteType" value="mybookmark" checked onchange="onPasteTypeChange()" style="width: 18px;height: 18px;cursor: pointer;">
                            <span style="font-size: 14px;color: #2d3748;" data-i18n="myBookmarkJSON">我的收藏夹 (JSON)</span>
                        </label>
                        <label style="display: flex;align-items: center;gap: 10px;padding: 12px;border: 2px solid #e2e8f0;border-radius: 8px;cursor: pointer;transition: all 0.3s;" onmouseover="this.style.borderColor='#4299e1';this.style.background='#ebf8ff'" onmouseout="this.style.borderColor='#e2e8f0';this.style.background='white'">
                            <input type="radio" name="pasteType" value="chrome" onchange="onPasteTypeChange()" style="width: 18px;height: 18px;cursor: pointer;">
                            <span style="font-size: 14px;color: #2d3748;" data-i18n="chromeEdgeHTML">Chrome/Edge书签 (HTML)</span>
                        </label>
                    </div>
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="display: block;margin-bottom: 10px;font-weight: bold;color: #4a5568;" data-i18n="pasteContentLabel">输入内容：</label>
                    <textarea id="pasteContentArea" rows="10" data-i18n-placeholder="pasteContentPlaceholder" placeholder="请在此处直接输入 JSON 或 HTML 内容..." style="width: 100%;padding: 12px;border: 2px solid #e2e8f0;border-radius: 6px;font-size: 13px;font-family: monospace;resize: vertical;outline: none;" onfocus="this.style.borderColor='#4299e1'" onblur="this.style.borderColor='#e2e8f0'" oninput="checkPasteContent()"></textarea>
                    <div id="pasteContentPreview" style="margin-top: 8px;padding: 8px;background: #f7fafc;border-radius: 4px;font-size: 13px;color: #4a5568;display: none;word-break: break-all;">
                    </div>
                </div>
            </div>
            
            <!-- Classic Bookmarks Section -->
            <div id="classicImportSection" style="display: none;">
                <div style="margin-bottom: 20px;">
                    <label style="display: block;margin-bottom: 10px;font-weight: bold;color: #4a5568;" data-i18n="selectCategoryLabel">选择主题分类：</label>
                    <select class="modal-input" id="classicCategorySelect" onchange="loadClassicBookmarks()">
                        <option value="" data-i18n="loadingCategories">加载中...</option>
                    </select>
                </div>
                <div id="classicPreviewSection" style="display: none;margin-bottom: 20px;">
                    <div style="display: flex;justify-content: space-between;align-items: center;margin-bottom: 10px;">
                        <label style="font-weight: bold;color: #4a5568;" data-i18n="previewContentLabel">预览内容：</label>
                        <div>
                            <button onclick="selectAllClassicLinks(true)" style="padding: 4px 12px;background: #4299e1;color: white;border: none;border-radius: 4px;cursor: pointer;font-size: 12px;margin-right: 5px;" data-i18n="selectAll">全选</button>
                            <button onclick="selectAllClassicLinks(false)" style="padding: 4px 12px;background: #e2e8f0;color: #4a5568;border: none;border-radius: 4px;cursor: pointer;font-size: 12px;" data-i18n="deselectAll">取消全选</button>
                        </div>
                    </div>
                    <div id="classicPreviewContent" style="max-height: 400px;overflow-y: auto;padding: 12px;background: #f7fafc;border-radius: 6px;font-size: 13px;color: #4a5568;">
                    </div>
                    <div id="selectedCountInfo" style="margin-top: 8px;padding: 8px;background: #ebf8ff;border-radius: 4px;font-size: 13px;color: #2b6cb0;display: none;">
                    </div>
                </div>
            </div>
            
            <!-- Unified Tab selection for all import methods (hidden by default) -->
            <div id="unifiedImportTabSection" style="display: none;margin-bottom: 20px;">
                <label style="display: block;margin-bottom: 10px;font-weight: bold;color: #4a5568;" data-i18n="selectTabForImport">请选择要导入到的选项卡：</label>
                <select class="modal-input" id="unifiedImportTabSelect"></select>
            </div>
            
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeImportTypeModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" id="startImportBtn" onclick="startImportProcess()" data-i18n="startImport" disabled style="opacity: 0.5;cursor: not-allowed;">开始导入</button>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal" style="max-width: 600px;">
            <h3 data-i18n="exportData">导出数据</h3>
            
            <!-- Step 1: Select export method -->
            <div style="margin-bottom: 20px;">
                <label style="display: block;margin-bottom: 10px;font-weight: bold;color: #4a5568;" data-i18n="exportMethodLabel">选择导出方式：</label>
                <div style="display: flex;gap: 10px;">
                    <button onclick="setExportMethod('file')" id="exportMethodFileBtn" style="flex: 1;padding: 10px;background: #4299e1;color: white;border: none;border-radius: 6px;cursor: pointer;font-size: 14px;transition: all 0.3s;">
                        <span data-i18n="exportToFile">📁 导出到文件</span>
                    </button>
                    <button onclick="setExportMethod('text')" id="exportMethodTextBtn" style="flex: 1;padding: 10px;background: #e2e8f0;color: #4a5568;border: none;border-radius: 6px;cursor: pointer;font-size: 14px;transition: all 0.3s;">
                        <span data-i18n="exportToText">📋 导出到文本框</span>
                    </button>
                </div>
            </div>
            
            <!-- File Export Section -->
            <div id="fileExportSection">
                <div style="margin-bottom: 15px;">
                    <label style="display: block;margin-bottom: 8px;color: #4a5568;font-weight: bold;" data-i18n="exportScopeLabel">选择导出范围：</label>
                    <select class="modal-input" id="exportScopeSelect" onchange="updateExportFormatOptions()">
                        <option value="all" data-i18n="exportAllOption">全部数据（包含所有选项卡和标题）</option>
                    </select>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block;margin-bottom: 8px;color: #4a5568;font-weight: bold;" data-i18n="exportFormatLabel">选择导出格式：</label>
                    <select class="modal-input" id="exportFormatSelect" onchange="updateExportFormatOptions()">
                        <option value="json" data-i18n="exportMyBookmarkFormat">我的收藏夹导出文件 (JSON)</option>
                        <option value="html" data-i18n="exportChromeFormat" disabled>Chrome书签 (HTML)</option>
                    </select>
                </div>
                <div style="background: #ebf8ff;border-left: 4px solid #4299e1;padding: 12px;margin-bottom: 20px;border-radius: 4px;">
                    <p style="color: #2b6cb0;font-size: 13px;margin: 0;" id="exportTipText" data-i18n="exportTip">
                         提示：选择"全部数据"将导出标题、所有选项卡及其内容；选择单个选项卡仅导出该选项卡的站点。
                    </p>
                </div>
            </div>
            
            <!-- Text Export Section -->
            <div id="textExportSection" style="display: none;">
                <div style="margin-bottom: 15px;">
                    <label style="display: block;margin-bottom: 8px;color: #4a5568;font-weight: bold;" data-i18n="exportScopeLabel">选择导出范围：</label>
                    <select class="modal-input" id="exportScopeSelectText" onchange="updateTextExportFormatOptions()">
                        <option value="all" data-i18n="exportAllOption">全部数据（包含所有选项卡和标题）</option>
                    </select>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block;margin-bottom: 8px;color: #4a5568;font-weight: bold;" data-i18n="exportFormatLabel">选择导出格式：</label>
                    <select class="modal-input" id="exportFormatSelectText" onchange="generateExportContent()">
                        <option value="json" data-i18n="exportMyBookmarkFormat">我的收藏夹导出文件 (JSON)</option>
                        <option value="html" data-i18n="exportChromeFormat" disabled>Chrome书签 (HTML)</option>
                    </select>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block;margin-bottom: 8px;color: #4a5568;font-weight: bold;" data-i18n="exportContentLabel">导出内容：</label>
                    <textarea id="exportContentArea" rows="12" readonly style="width: 100%;padding: 12px;border: 2px solid #e2e8f0;border-radius: 6px;font-size: 13px;font-family: monospace;resize: vertical;outline: none;background: #f7fafc;" onfocus="this.style.borderColor='#4299e1'" onblur="this.style.borderColor='#e2e8f0'"></textarea>
                    <div style="margin-top: 8px;display: flex;justify-content: space-between;align-items: center;">
                        <span id="exportContentInfo" style="font-size: 13px;color: #718096;"></span>
                        <button onclick="copyExportContent()" id="copyExportBtn" style="padding: 8px 16px;background: #4299e1;color: white;border: none;border-radius: 6px;cursor: pointer;font-size: 13px;transition: all 0.3s;" disabled>
                            <span data-i18n="copyContent">📋 复制内容</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="modal-buttons" id="fileExportButtons">
                <button class="cancel-btn" onclick="closeExportModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" onclick="confirmExport()" data-i18n="exportData">导出</button>
            </div>
            
            <div class="modal-buttons" id="textExportButtons" style="display: none;">
                <button class="cancel-btn" onclick="closeExportModal()" data-i18n="cancel">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // 语言配置
        const i18n = {
            zh: {
                pageTitle: '我的收藏夹',
                defaultTitle: '我的收藏夹',
                defaultTabName: '我的常用站点',
                largeIcon: '大图标',
                mediumIcon: '中图标',
                smallIcon: '小图标',
                addBookmark: '添加收藏',
                exportData: '导出数据',
                importData: '导入数据',
                importTypeLabel: '选择导入类型：',
                importMyBookmark: '我的收藏夹导出文件',
                importChromeEdge: 'Chrome/Edge书签文件',
                selectTabForImport: '请选择要导入到的选项卡：',
                startImport: '开始导入',
                selectFileLabel: '选择文件：',
                clickToSelectFile: '📁 点击选择文件',
                noBookmarks: '暂无收藏，添加你的第一个网址',

        let currentLanguage = localStorage.getItem('language') || 'zh';
        
        // 设置语言
        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);
            applyLanguage();
        }
        
        // 应用语言
        function applyLanguage() {
            const texts = i18n[currentLanguage];
            
            // 更新所有带有 data-i18n 属性的元素
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (texts[key]) {
                    el.textContent = texts[key];
                }
            });
            
            // 更新所有带有 data-i18n-placeholder 属性的元素
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (texts[key]) {
                    el.placeholder = texts[key];
                }
            });
            
            // 更新所有带有 data-i18n-title 属性的元素（title 属性）
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (texts[key]) {
                    el.title = texts[key];
                }
            });
            
            // 更新语言文本状态
            const langZh = document.getElementById('langZh');
            const langEn = document.getElementById('langEn');
            if (langZh) langZh.classList.toggle('active', currentLanguage === 'zh');
            if (langEn) langEn.classList.toggle('active', currentLanguage === 'en');
            
            // 重新加载标题、链接和标签页以应用语言设置
            loadTitle();
            loadLinks();
            loadTabs();
        }
        
        // 获取翻译文本
        function t(key, params = {}) {
            let text = i18n[currentLanguage][key] || key;
            // 替换模板中的占位符 {paramName}
            Object.keys(params).forEach(param => {
                text = text.replace(`{${param}}`, params[param]);
            });
            return text;
        }
        
        // 页面加载读取数据
        window.onload = async function() {
            await loadConstants();
            // 先加载 Tabs，确保 currentTabId 被正确初始化
            await loadTabs();
            loadTitle();
            loadLinks();
            applyLanguage(); // 应用语言设置
        };

        // 加载常量配置
        async function loadConstants() {
            try {
                console.log('Loading constants from API...');
                const response = await fetch('/api/getConstants');
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('API result:', result);
                
                if (result.code !== 0) {
                    throw new Error(result.message || 'Failed to get constants');
                }
                
                const constants = {
                    version: result.version,
                    copyright: result.copyright
                };
                console.log('Constants loaded:', constants);
                
                // 更新页脚版权信息
                const footer = document.querySelector('.footer');
                console.log('Footer element:', footer);
                
                if (footer && constants.version && constants.copyright) {
                    // 只显示版权信息，不显示版本号
                    footer.textContent = constants.copyright;
                    console.log('Footer updated');
                } else {
                    console.warn('Missing version or copyright in constants');
                }
            } catch (error) {
                console.error('Failed to load constants:', error);
                // 如果加载失败，使用默认值
                const footer = document.querySelector('.footer');
                if (footer) {
                    footer.textContent = '(c) DSH-MyBookmark v1.0.0';
                    console.log('Using default footer text');
                }
            }
        }

        let promptCallback = null;

        // 生成随机 ID（16位十六进制字符串）
        function generateRandomId() {
            return Math.random().toString(16).substring(2, 18);
        }

        // 读取列表
        async function loadLinks() {
            const res = await fetch('/api/get');
            const data = await res.json();
            
            // 从 localStorage 获取 currentTabId
            const tabId = localStorage.getItem('currentTabId');
            let list = [];
            
            if (tabId && data.tabs) {
                const currentTab = data.tabs.find(t => t.id === tabId);
                if (currentTab) {
                    list = currentTab.links || [];
                }
            }
            
            // iconSize 已经从 localStorage 初始化，不需要从服务器获取
            
            // 更新按钮状态
            updateIconSizeButtons();
            
            const el = document.getElementById('linkList');
            if (list.length === 0) {
                el.innerHTML = '<div class="empty" data-i18n="noBookmarks">' + t('noBookmarks') + '</div>';
                return;
            }
            let html = '';
            list.forEach(item => {
                const favicon = getFaviconUrl(item);
                console.log('Loading favicon for:', item.name, '(ID:', item.id, ')', '->', favicon);

                const isLocked = item.locked === true; // 检查是否锁定
                
                if (currentIconSize === 'small') {
                    // 小图标模式：横向布局
                    html += `
                    <div class="link-card ${smallIconMode} ${isLocked ? 'locked' : ''}" draggable="${!isLocked}" data-id="${item.id}" 
                         ondragstart="handleDragStart(event)" 
                         ondragend="handleDragEnd(event)"
                         ondragover="handleDragOver(event)"
                         ondrop="handleDrop(event)">
                        ${!isLocked ? `<button class="move-btn-icon" onclick="showMoveToTabModal('${item.id}')" title="${t('moveToOtherTab')}">⇄</button>` : ''}
                        ${!isLocked ? `<button class="lock-btn-icon" onclick="toggleLockCard('${item.id}', true)" title="${t('lockCard')}">🔓</button>` : ''}
                        ${isLocked ? `<button class="unlock-btn-icon" onclick="toggleLockCard('${item.id}', false)" title="${t('unlockCard')}">🔒</button>` : ''}
                        <div class="link-icon ${iconClass}" style="background-size: cover; background-position: center; cursor: pointer;" onclick="window.open('${item.url}','_blank')" title="${item.name}">

                        ${!isLocked ? `
                        <div class="card-actions">
                            <button class="card-btn edit-btn" onclick="openEditModal('${item.id}')" title="${t('editButton')}">✏️</button>
                            <button class="card-btn del-btn" onclick="delLink('${item.id}')" title="${t('deleteButton')}">🗑️</button>
                            <button class="card-btn refresh-btn" onclick="refreshFavicon('${item.id}')" title="${t('refreshIcon')}">⟳</button>
                        </div>
                        ` : ''}
                    </div>`;
                } else {
                    // 大/中图标模式：纵向布局
                    html += `
                    <div class="link-card ${isLocked ? 'locked' : ''}" draggable="${!isLocked}" data-id="${item.id}" 
                         ondragstart="handleDragStart(event)" 
                         ondragend="handleDragEnd(event)"
                         ondragover="handleDragOver(event)"
                         ondrop="handleDrop(event)">
                        ${!isLocked ? `<button class="move-btn-icon" onclick="showMoveToTabModal('${item.id}')" title="${t('moveToOtherTab')}">⇄</button>` : ''}
                        ${!isLocked ? `<button class="lock-btn-icon" onclick="toggleLockCard('${item.id}', true)" title="${t('lockCard')}">🔓</button>` : ''}
                        ${isLocked ? `<button class="unlock-btn-icon" onclick="toggleLockCard('${item.id}', false)" title="${t('unlockCard')}">🔒</button>` : ''}
                        <div class="link-icon ${iconClass}" style="background-size: cover; background-position: center; cursor: pointer;" onclick="window.open('${item.url}','_blank')" title="${item.name}">
                            <img src="${favicon}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'">
                        </div>
                        <div class="link-name">${item.name}</div>
                        <div class="link-url"><a href="${item.url}" target="_blank">${item.url}</a></div>
                        ${item.note ? `<div class="link-note">${item.note}</div>` : ''}
                        ${!isLocked ? `
                        <div class="card-actions">
                            <button class="card-btn edit-btn" onclick="openEditModal('${item.id}')" title="${t('editButton')}">✏️</button>
                            <button class="card-btn del-btn" onclick="delLink('${item.id}')" title="${t('deleteButton')}">🗑️</button>

                        </div>
                        ` : ''}

                }
            });
            el.innerHTML = html;
            
            // 延迟5秒后刷新 favicon（通过重新设置 src 触发浏览器重新请求）
            setTimeout(() => {
                console.log('Refreshing favicons after 5 seconds...');
                list.forEach(item => {
                    const card = document.querySelector(`.link-card[data-id="${item.id}"]`);
                    if (card) {
                        const imgElement = card.querySelector('.link-icon img');
                        if (imgElement) {
                            // 重新生成带新时间戳的 URL，触发浏览器重新请求
                            const newFaviconUrl = getFaviconUrl(item);
                            imgElement.src = newFaviconUrl;
                            console.log('Refreshed favicon for:', item.name, '->', newFaviconUrl);
                        }
                    }
                });
            }, 5000);
        }

        // 加载 Tabs
        async function loadTabs() {
            const res = await fetch('/api/get');
            const data = await res.json();
            let tabs = data.tabs || [{ id: generateRandomId(), name: '我的常用站点', links: [] }];
            
            // 根据当前语言转换默认 tab 名称
            tabs = tabs.map(tab => {
                if (tab.name === '我的常用站点' && currentLanguage === 'en') {
                    return { ...tab, name: t('defaultTabName') };
                } else if (tab.name === 'My Favorite Sites' && currentLanguage === 'zh') {
                    return { ...tab, name: t('defaultTabName') };
                }
                return tab;
            });
            
            // 如果没有当前选中的 tab，选中第一个并保存到 localStorage
            if (!currentTabId || !tabs.find(t => t.id === currentTabId)) {
                // 如果 currentTabId 为空，或者当前 ID 对应的 tab 不存在（比如首次打开时 default tab）
                currentTabId = tabs[0].id;
                localStorage.setItem('currentTabId', currentTabId);
                console.log('Initialized currentTabId to:', currentTabId);
            }
            
            // 计算下一个 Tab 序号
            calculateNextTabNumber(tabs);
            
            renderTabs(tabs);
        }

        // 计算下一个 Tab 序号
        function calculateNextTabNumber(tabs) {
            let maxNum = 1;
            tabs.forEach(tab => {
                // 匹配中文格式：选项卡#数字
                const matchZh = tab.name.match(/^选项卡#(\d+)$/);
                // 匹配英文格式：Tab #数字
                const matchEn = tab.name.match(/^Tab #(\d+)$/);
                
                if (matchZh) {
                    const num = parseInt(matchZh[1]);
                    if (num > maxNum) {
                        maxNum = num;
                    }
                } else if (matchEn) {
                    const num = parseInt(matchEn[1]);
                    if (num > maxNum) {
                        maxNum = num;
                    }
                }
            });
            nextTabNumber = maxNum + 1;
        }

        // 渲染 Tabs
        function renderTabs(tabs) {
            const header = document.getElementById('tabHeader');
            let html = '';
            
            tabs.forEach((tab, index) => {
                const activeClass = tab.id === currentTabId ? 'active' : '';
                const activeIcon = tab.id === currentTabId ? '<span class="tab-active-icon">●</span>' : '';
                const closeBtn = tabs.length > 1 ? `<span class="tab-close" onclick="deleteTab('${tab.id}', event)">×</span>` : '';
                const siteCount = tab.links ? tab.links.length : 0;
                html += `
                    <div class="tab-item ${activeClass}" draggable="true" data-tab-id="${tab.id}"
                         ondragstart="handleTabDragStart(event)"
                         ondragend="handleTabDragEnd(event)"
                         ondragover="handleTabDragOver(event)"
                         ondrop="handleTabDrop(event)"
                         ondragenter="handleTabDragEnter(event)"
                         ondragleave="handleTabDragLeave(event)">
                        ${activeIcon}<span class="tab-name" id="tab-name-${tab.id}" title="${t('doubleClickToEdit')}">${tab.name}</span>
                        <span class="tab-count">(${siteCount})</span>
                        ${closeBtn}
                    </div>
                `;
            });
            
            html += `<button class="add-tab-btn" onclick="addTab()">+ ${t('addTabButton')}</button>`;
            header.innerHTML = html;
            
            // 为每个 Tab 绑定事件
            tabs.forEach(tab => {
                const tabElement = document.querySelector(`.tab-item[data-tab-id="${tab.id}"]`);
                const nameElement = document.getElementById(`tab-name-${tab.id}`);
                
                if (tabElement && nameElement) {
                    let clickTimer = null;
                    
                    // 使用延迟处理单击/双击
                    tabElement.addEventListener('click', function(e) {
                        if (e.target.classList.contains('tab-close')) return;
                        
                        if (clickTimer) {
                            // 已经有一次点击，这是双击
                            clearTimeout(clickTimer);
                            clickTimer = null;
                            e.stopPropagation();
                            startEditTabName(tab.id, nameElement);
                        } else {
                            // 第一次点击，等待看是否有第二次点击
                            clickTimer = setTimeout(() => {
                                clickTimer = null;
                                switchTab(tab.id);
                            }, 250); // 250ms 内再次点击算双击
                        }
                    });
                }
            });
        }

        // 开始编辑 Tab 名称
        function startEditTabName(tabId, element) {
            const currentName = element.textContent;
            
            // 创建容器
            const container = document.createElement('div');
            container.style.display = 'flex';
            container.style.alignItems = 'center';
            container.style.gap = '4px';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'tab-name-input';
            input.value = currentName;
            input.style.flex = '1';
            
            // 创建取消按钮
            const cancelBtn = document.createElement('button');
            cancelBtn.innerHTML = '×';
            cancelBtn.style.cssText = 'background: #e53e3e;color: white;border: none;border-radius: 3px;width: 20px;height: 20px;cursor: pointer;font-size: 14px;display: flex;align-items: center;justify-content: center;padding: 0;line-height: 1;flex-shrink: 0;';
            
            container.appendChild(input);
            container.appendChild(cancelBtn);
            
            // 阻止事件冒泡，避免触发 Tab 切换
            container.addEventListener('click', (e) => e.stopPropagation());
            container.addEventListener('dblclick', (e) => e.stopPropagation());
            
            element.replaceWith(container);
            input.focus();
            input.select();
            
            let isCancelled = false;
            
            // 失去焦点或按回车时保存
            const saveEdit = () => {
                if (isCancelled) return;
                
                const newName = input.value.trim();
                if (newName && newName !== currentName) {
                    updateTabName(tabId, newName);
                } else if (!newName) {
                    // 如果名称为空，恢复原名称
                    showToast(t('tabNameCannotEmpty'), 'warning');
                    isCancelled = true;
                    container.replaceWith(createTabNameElement(currentName, tabId));
                } else {
                    // 名称未改变，恢复原样
                    isCancelled = true;
                    container.replaceWith(createTabNameElement(currentName, tabId));
                }
            };
            
            // 点击取消按钮
            cancelBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                isCancelled = true;
                container.replaceWith(createTabNameElement(currentName, tabId));
            });
            
            input.addEventListener('blur', () => {
                setTimeout(saveEdit, 100); // 延迟执行，让取消按钮点击先处理
            });
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    saveEdit();
                }
            });
            
            // 按ESC取消
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    isCancelled = true;
                    container.replaceWith(createTabNameElement(currentName, tabId));
                }
            });
        }

        // 添加 Tab
        async function addTab() {
            const res = await fetch('/api/get');
            const data = await res.json();
            const tabs = data.tabs || [];
            
            // 检查是否已达到最大数量
            if (tabs.length >= 20) {
                showToast('最多只能创建20个选项卡', 'warning');
                return;
            }
            
            // 使用递增的序号作为默认名称，根据语言显示
            const defaultName = currentLanguage === 'zh' ? `选项卡#${nextTabNumber}` : `Tab #${nextTabNumber}`;
            
            customPrompt(t('enterTabName'), defaultName, async (name) => {
                if (!name || !name.trim()) return;
                
                try {
                    const response = await fetch('/api/addTab', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name.trim() })
                    });
                    
                    const result = await response.json();
                    
                    if (result.code === 0) {
                        // 自动切换到新tab并保存到 localStorage
                        currentTabId = result.tabId;
                        localStorage.setItem('currentTabId', result.tabId);
                        
                        // 如果使用的是默认名称，增加序号
                        const zhDefaultName = `选项卡#${nextTabNumber}`;
                        const enDefaultName = `Tab #${nextTabNumber}`;
                        if (name.trim() === zhDefaultName || name.trim() === enDefaultName) {
                            nextTabNumber++;
                        } else {
                            // 如果用户自定义了名称，重新计算序号
                            const res = await fetch('/api/get');
                            const data = await res.json();
                            calculateNextTabNumber(data.tabs || []);
                        }
                        
                        // 切换到新 Tab
                        if (result.tabId) {
                            currentTabId = result.tabId;
                        }
                        
                        // 重新加载 Tabs 和 Links
                        await loadTabs();
                        await loadLinks();
                        showToast(t('addTabSuccess'), 'success');
                    } else {
                        showToast(result.message || t('addTabFailed'), 'error');
                    }
                } catch (error) {
                    console.error('Add tab error:', error);
                    showToast(t('addTabFailed'), 'error');
                }
            });
        }

        // 删除 Tab
        async function deleteTab(tabId, event) {
            event.stopPropagation();
            
            customConfirm(t('confirmDeleteTab'), async (confirmed) => {
                if (!confirmed) return;
                
                try {
                    const res = await fetch('/api/deleteTab', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tabId })
                    });
                    const result = await res.json();
                    
                    if (result.code === 0) {
                        // 如果删除的是当前tab，切换到第一个tab
                        const res = await fetch('/api/get');
                        const data = await res.json();
                        
                        if (currentTabId === tabId && data.tabs && data.tabs.length > 0) {
                            currentTabId = data.tabs[0].id;
                            localStorage.setItem('currentTabId', currentTabId);
                        }
                        
                        loadTabs();
                        loadLinks();
                        showToast(t('deleteTabSuccess'), 'success');
                    } else {
                        // 如果服务器返回了 messageKey，使用翻译；否则使用 message 或默认错误消息
                        let errorMessage;
                        if (result.messageKey) {
                            // 如果有额外的参数，传递给翻译函数
                            const params = result.linkCount !== undefined ? { count: result.linkCount } : {};
                            errorMessage = t(result.messageKey, params);
                        } else {
                            errorMessage = result.message || t('deleteTabFailed');
                        }
                        showToast(errorMessage, 'error');
                    }
                } catch (error) {
                    console.error('Delete tab error:', error);
                    showToast(t('deleteTabFailed'), 'error');
                }
            });
        }

        // Tab 拖拽功能
        function handleTabDragStart(event) {
            draggedTabElement = event.target.closest('.tab-item');
            if (!draggedTabElement) return;
            draggedTabElement.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
        }

        function handleTabDragEnd(event) {
            if (draggedTabElement) {
                draggedTabElement.classList.remove('dragging');
                document.querySelectorAll('.tab-item').forEach(tab => {
                    tab.classList.remove('drag-over');
                });
                draggedTabElement = null;
            }
        }

        function handleTabDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            const tab = event.target.closest('.tab-item');
            if (tab && tab !== draggedTabElement) {
                tab.classList.add('drag-over');
            }
        }

        // 拖动进入选项卡
        function handleTabDragEnter(event) {
            event.preventDefault();
            const tab = event.target.closest('.tab-item');
            if (tab && draggedLinkId) {
                // 如果拖动的是站点卡片，高亮选项卡
                tab.style.background = '#bee3f8';
            }
        }

        // 拖动离开选项卡
        function handleTabDragLeave(event) {
            const tab = event.target.closest('.tab-item');
            if (tab) {
                tab.style.background = '';
            }
        }

        async function handleTabDrop(event) {
            event.preventDefault();
            const targetTab = event.target.closest('.tab-item');
            
            // 重置样式
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.style.background = '';
            });
            
            if (!targetTab) {
                return;
            }
            
            const targetTabId = targetTab.dataset.tabId; // Tab ID 可能是字符串或数字
            
            // 如果拖动的是站点卡片
            if (draggedLinkId) {
                // 不能移动到当前选项卡
                if (targetTabId === currentTabId) {
                    draggedLinkId = null;
                    return;
                }
                
                try {
                    const response = await fetch('/api/moveLinkToTab', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            linkId: draggedLinkId,
                            fromTabId: currentTabId,
                            toTabId: targetTabId
                        })
                    });
                    
                    const result = await response.json();
                    if (result.code === 0) {
                        showToast('站点已移动', 'success');
                        loadLinks();
                        loadTabs();
                    } else {
                        showToast(result.message || '移动失败', 'error');
                    }
                } catch (error) {
                    console.error('Move link error:', error);
                    showToast('移动失败：' + error.message, 'error');
                }
                
                draggedLinkId = null;
                return;
            }
            
            // 如果拖动的是选项卡（原有的逻辑）
            if (!draggedTabElement || targetTab === draggedTabElement) {
                return;
            }

            const header = document.getElementById('tabHeader');
            const tabs = Array.from(header.querySelectorAll('.tab-item'));
            
            const draggedIndex = tabs.indexOf(draggedTabElement);
            const targetIndex = tabs.indexOf(targetTab);

            if (draggedIndex === -1 || targetIndex === -1) {
                return;
            }

            // 重新排列DOM元素
            if (draggedIndex < targetIndex) {
                header.insertBefore(draggedTabElement, targetTab.nextSibling);
            } else {
                header.insertBefore(draggedTabElement, targetTab);
            }

            // 获取新的顺序并保存到服务器
            const newOrderTabs = Array.from(header.querySelectorAll('.tab-item'));
            const tabIds = newOrderTabs.map(tab => tab.dataset.tabId); // Tab ID 可能是字符串或数字
            
            try {
                await fetch('/api/updateTabOrder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tabIds })
                });
                console.log('Tab order saved');
            } catch (error) {
                console.error('Save tab order error:', error);
                loadTabs();
            }
        }

        // 确保URL有协议前缀
        function ensureUrlProtocol(url) {
            if (!url) return url;
            const trimmed = url.trim();
            // 如果已经有协议前缀，直接返回
            if (/^https?:\/\//i.test(trimmed)) {
                return trimmed;
            }
            // 如果没有协议，添加 https://
            return 'https://' + trimmed;
        }

        // 从 URL 提取网站名称
        function extractNameFromUrl(url) {
            try {
                const urlObj = new URL(url);
                const hostname = urlObj.hostname;
                // 去除 www. 前缀
                const name = hostname.replace(/^www\./, '');
                // 取第一个部分作为名称
                const parts = name.split('.');
                return parts[0] || name;
            } catch {
                return '';
            }
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            const card = event.target.closest('.link-card');
            if (card && card !== draggedElement) {
                card.classList.add('drag-over');
            }
        }

        async function handleDrop(event) {
            event.preventDefault();
            const targetCard = event.target.closest('.link-card');
            
            if (!targetCard || !draggedElement || targetCard === draggedElement) {
                return;
            }

            // 获取所有卡片的ID顺序
            const grid = document.getElementById('linkList');
            const cards = Array.from(grid.querySelectorAll('.link-card'));
            
            // 找到拖动元素和目标元素的位置
            const draggedIndex = cards.indexOf(draggedElement);
            const targetIndex = cards.indexOf(targetCard);

            if (draggedIndex === -1 || targetIndex === -1) {
                return;
            }

            // 重新排列DOM元素
            if (draggedIndex < targetIndex) {
                grid.insertBefore(draggedElement, targetCard.nextSibling);
            } else {
                grid.insertBefore(draggedElement, targetCard);
            }

            // 获取新的顺序并保存到服务器
            const newOrderCards = Array.from(grid.querySelectorAll('.link-card'));
            const linkIds = newOrderCards.map(card => card.dataset.id); // ID 现在是字符串
            
            try {
                await fetch('/api/updateOrder', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ linkIds, tabId: currentTabId })
                });
                console.log('Order saved to server');
            } catch (error) {
                console.error('Save order error:', error);
                // 如果保存失败，重新加载列表恢复原状
                loadLinks();
            }
        }

        // 格式化日期时间为 yyyyMMddHHmmss
        function formatDateTime(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}${month}${day}${hours}${minutes}${seconds}`;
        }

        // 导出为 Chrome HTML 格式
        async function exportAsChromeHTML(data, scope) {
            // 获取要导出的选项卡
            let tabsToExport = [];
            if (scope === 'all') {
                tabsToExport = data.tabs;
            } else {
                const selectedTab = data.tabs.find(t => t.id === scope);
                if (selectedTab) {
                    tabsToExport = [selectedTab];
                }
            }
            
            if (tabsToExport.length === 0) {
                showToast('没有可导出的数据', 'error');
                return;
            }
            
            // 生成 Chrome 书签 HTML
            const htmlContent = generateChromeBookmarksHTML(tabsToExport);
            
            // 创建文件名
            const timestamp = formatDateTime(new Date());
            let filename;
            if (scope === 'all') {
                filename = `chrome_bookmarks_all_${timestamp}.html`;
            } else {
                const tabName = tabsToExport[0].name.replace(/[\\/:*?"<>|]/g, '_');
                filename = `chrome_bookmarks_${tabName}_${timestamp}.html`;
            }
            
            // 创建并下载文件
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // 生成 Chrome 书签 HTML
        function generateChromeBookmarksHTML(tabs) {
            const now = new Date();
            const timestamp = Math.floor(now.getTime() / 1000);
            
            let html = `<!DOCTYPE NETSCAPE-Bookmark-file-1>
<!-- This is an automatically generated file.
     It will be read and overwritten.
     DO NOT EDIT! -->
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
<TITLE>Bookmarks</TITLE>
<H1>Bookmarks</H1>
<DL><p>
`;
            
            tabs.forEach(tab => {
                // 直接使用选项卡名称作为根文件夹
                html += `    <DT><H3 ADD_DATE="${timestamp}" LAST_MODIFIED="${timestamp}">${escapeHtml(tab.name)}</H3>
    <DL><p>
`;
                
                if (tab.links && tab.links.length > 0) {
                    tab.links.forEach(link => {
                        const linkTimestamp = timestamp;
                        html += `        <DT><A HREF="${escapeHtml(link.url)}" ADD_DATE="${linkTimestamp}">${escapeHtml(link.name)}</A>
`;
                    });
                }
                
                html += `    </DL><p>
`;
            });
            
            html += `</DL><p>
`;
            
            return html;
        }

        // HTML 转义
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function checkPasteContent() {
            const content = document.getElementById('pasteContentArea').value.trim();
            const previewDiv = document.getElementById('pasteContentPreview');
            const startBtn = document.getElementById('startImportBtn');
            const pasteType = document.querySelector('input[name="pasteType"]:checked').value;
            
            if (content.length === 0) {
                previewDiv.style.display = 'none';
                
                // 禁用开始导入按钮
                startBtn.disabled = true;
                startBtn.style.opacity = '0.5';
                startBtn.style.cursor = 'not-allowed';
                return;
            }
            
            // 根据类型进行格式校验
            let isValid = false;
            let errorMsg = '';
            
            if (pasteType === 'mybookmark') {
                // 校验 JSON 格式
                try {
                    const parsed = JSON.parse(content);
                    
                    // 检查是否有 tabs 数组（必需）
                    if (!parsed.tabs || !Array.isArray(parsed.tabs)) {
                        errorMsg = t('jsonFormatErrorMissingTabs');
                        isValid = false;
                    } else if (parsed.tabs.length === 0) {
                        // 允许空的 tabs 数组
                        isValid = true;
                    } else {
                        // 验证每个选项卡的基本结构
                        // id 和 name 是必需的，links 可以是空数组或不存在
                        const hasValidStructure = parsed.tabs.every(tab => {
                            // id 和 name 必须存在且不为空
                            const hasId = tab.id && typeof tab.id !== 'undefined';
                            const hasName = tab.name && typeof tab.name === 'string';
                            // links 可以是数组、空数组或不存在
                            const linksValid = !tab.links || Array.isArray(tab.links);
                            return hasId && hasName && linksValid;
                        });
                        
                        if (!hasValidStructure) {
                            errorMsg = t('jsonFormatErrorIncompleteStructure');
                            isValid = false;
                        } else {
                            isValid = true;
                        }
                    }
                } catch (e) {
                    errorMsg = t('jsonFormatErrorMessage') + e.message;
                    isValid = false;
                }
            } else if (pasteType === 'chrome') {
                // 校验 HTML 格式（检查是否包含书签相关标签）
                const htmlLower = content.toLowerCase();
                
                // 检查是否是有效的 Netscape 书签格式
                const isNetscapeFormat = htmlLower.includes('<!doctype netscape-bookmark-file-1>');
                const hasBookmarkStructure = htmlLower.includes('<dl>') && 
                                            htmlLower.includes('<dt>') && 
                                            (htmlLower.includes('<a href=') || htmlLower.includes('<h3'));
                
                if (isNetscapeFormat && hasBookmarkStructure) {
                    isValid = true;
                } else if (!isNetscapeFormat) {
                    errorMsg = t('htmlFormatErrorInvalid');
                    isValid = false;
                } else {
                    errorMsg = t('htmlFormatErrorIncomplete');
                    isValid = false;
                }
            }
            
            // 显示预览和验证结果
            const previewText = content.length > 100 ? content.substring(0, 100) + '...' : content;
            if (isValid) {
                const formatName = pasteType === 'mybookmark' ? 'JSON' : 'HTML';
                const successMsg = t('formatCorrectInputChars').replace('{format}', formatName).replace('{chars}', content.length);
                previewDiv.innerHTML = `<span style="color: #38a169;">${successMsg}</span><br><span style="color: #718096;font-size: 12px;">${previewText}</span>`;
                previewDiv.style.display = 'block';
                
                // 启用开始导入按钮
                startBtn.disabled = false;
                startBtn.style.opacity = '1';
                startBtn.style.cursor = 'pointer';
            } else {
                previewDiv.innerHTML = `<span style="color: #e53e3e;">${errorMsg}</span>`;
                previewDiv.style.display = 'block';
                
                // 禁用开始导入按钮
                startBtn.disabled = true;
                startBtn.style.opacity = '0.5';
                startBtn.style.cursor = 'not-allowed';
            }
        }

        // 开始导入流程
        async function startImportProcess() {
            if (currentImportMethod === 'classic') {
                // 经典收藏导入
                if (!window.classicImportData) {
                    showToast('请先选择主题分类', 'error');
                    return;
                }
                
                const data = window.classicImportData;
                const targetTabId = document.getElementById('unifiedImportTabSelect').value;
                
                if (!targetTabId) {
                    showToast('请选择要导入到的选项卡', 'error');
                    return;
                }
                
                // 获取选中的链接
                const selectedCheckboxes = document.querySelectorAll('.link-checkbox:checked');
                let selectedLinks = [];
                
                selectedCheckboxes.forEach(checkbox => {
                    const tabIndex = parseInt(checkbox.dataset.tab);
                    const linkIndex = parseInt(checkbox.dataset.link);
                    
                    if (data.tabs && data.tabs[tabIndex] && data.tabs[tabIndex].links && data.tabs[tabIndex].links[linkIndex]) {
                        selectedLinks.push(data.tabs[tabIndex].links[linkIndex]);
                    }
                });
                
                if (selectedLinks.length === 0) {
                    showToast('请至少选择一个书签', 'error');
                    return;
                }
                
                // 确认导入
                customConfirm(`${t('confirmImport')} ${selectedLinks.length} ${t('bookmarks')}？${t('willMergeWithExisting')}`, async (confirmed) => {
                    if (!confirmed) {
                        return;
                    }
                    
                    // 关闭导入对话框
                    closeImportTypeModal();
                    
                    // 调用后端 API 导入数据到指定选项卡
                    try {
                        const response = await fetch('/api/importToTab', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                tabId: targetTabId,
                                links: selectedLinks
                            })
                        });
                        
                        const result = await response.json();
                        if (result.code === 0) {
                            let message = t('importSuccess');
                            if (result.added !== undefined && result.skipped !== undefined) {
                                message = t('importComplete') + result.added + t('skipDuplicate') + result.skipped + ' ';
                            } else if (result.message) {
                                message = result.message;
                            }
                            showToast(message, 'success');
                            // 重新加载整个页面数据（包括tabs和links）
                            await loadTabs();
                            await loadLinks();
                        } else {
                            showToast(t('importFailed') + (result.message || t('unknownError')), 'error');
                        }
                    } catch (error) {
                        console.error('Import error:', error);
                        showToast(t('importFailed') + error.message, 'error');
                    }
                });
                return;
            }
            
            const importType = currentImportMethod === 'file' 
                ? document.querySelector('input[name="importType"]:checked').value
                : document.querySelector('input[name="pasteType"]:checked').value;
            
            let dataToImport;
            
            if (currentImportMethod === 'file') {
                // 从文件导入
                if (!pendingImportFile) {
                    showToast(t('invalidFileFormat'), 'error');
                    return;
                }
                
                try {
                    const fileContent = await readFileAsText(pendingImportFile);
                    dataToImport = fileContent;
                } catch (error) {
                    console.error('Read file error:', error);
                    showToast('读取文件失败：' + error.message, 'error');
                    return;
                }
            } else {
                // 从粘贴内容导入
                const content = document.getElementById('pasteContentArea').value.trim();
                if (!content) {
                    showToast('请粘贴内容', 'warning');
                    return;
                }
                dataToImport = content;
            }
            
            // 保存数据引用，因为 closeImportTypeModal 会清空
            const dataRef = dataToImport;
            
            // 不要在这里关闭对话框，让导入函数自己决定何时关闭
            // closeImportTypeModal();
            
            if (importType === 'mybookmark') {
                // 使用原有的导入逻辑
                await importMyBookmarkDataFromString(dataRef);
            } else if (importType === 'chrome') {
                // 使用 Chrome/Edge 导入逻辑
                const targetTabId = document.getElementById('unifiedImportTabSelect').value;
                
                if (!targetTabId) {
                    showToast(t('selectTabForImport'), 'error');
                    return;
                }
                await importChromeBookmarksFromString(dataRef, targetTabId);
            }
        }

        // 读取文件为文本
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(new Error('Failed to read file'));
                reader.readAsText(file);
            });
        }

        // 从字符串导入 My Bookmark 数据
        async function importMyBookmarkDataFromString(jsonString) {
            try {
                const data = JSON.parse(jsonString);
                
                // 验证数据结构
                if (!data.tabs) {
                    showToast(t('jsonFormatErrorMissingTabs'), 'error');
                    return; // 失败时不关闭窗口
                }
                
                if (!Array.isArray(data.tabs)) {
                    showToast(t('jsonFormatErrorMissingTabs'), 'error');
                    return; // 失败时不关闭窗口
                }
                
                // 计算要导入的项目数量
                let itemCount = 0;
                if (data.tabs && Array.isArray(data.tabs)) {
                    data.tabs.forEach(tab => {
                        if (tab.links && Array.isArray(tab.links)) {
                            itemCount += tab.links.length;
                        }
                    });
                }
                
                if (itemCount === 0) {
                    showToast('文件中没有找到可导入的书签', 'error');
                    return; // 失败时不关闭窗口
                }
                
                // 确认导入
                customConfirm(`${t('confirmImport')} ${itemCount} ${t('bookmarks')}？${t('willMergeWithExisting')}`, async (confirmed) => {
                    if (!confirmed) {
                        // 用户取消，不关闭窗口，让用户可以继续操作
                        return;
                    }
                    
                    // 用户确认后，关闭导入对话框
                    closeImportTypeModal();
                    
                    // 如果包含 config，先保存配置
                    if (data.config) {
                        try {
                            await fetch('/api/saveConfig', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    copyright: data.config.copyright
                                })
                            });
                            console.log('Config imported successfully');
                        } catch (configError) {
                            console.error('Failed to import config:', configError);
                        }
                    }
                    
                    // 调用后端 API 导入数据
                    const response = await fetch('/api/import', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });
                    
                    const result = await response.json();
                    if (result.code === 0) {
                        let message = t('importSuccess');
                        if (result.added !== undefined && result.skipped !== undefined) {
                            message = t('importComplete') + result.added + t('skipDuplicate') + result.skipped + ' ';
                        } else if (result.message) {
                            message = result.message;
                        }
                        showToast(message, 'success');
                        // 重新加载整个页面数据（包括tabs和links）
                        await loadTabs();
                        await loadLinks();
                    } else {
                        showToast(t('importFailed') + (result.message || t('unknownError')), 'error');
                    }
                });
            } catch (error) {
                console.error('Parse JSON error:', error);
                if (error instanceof SyntaxError) {
                    showToast(t('jsonFormatErrorMessage') + error.message, 'error');
                } else {
                    showToast(t('invalidFileFormat'), 'error');
                }
                // 失败时不关闭窗口，让用户可以修改内容后重试
            }
        }

        // 从字符串导入 Chrome 书签
        async function importChromeBookmarksFromString(htmlString, targetTabId) {
            try {
                // 解析 HTML 并提取书签
                const bookmarks = parseChromeBookmarksHTML(htmlString);
                
                if (!bookmarks || bookmarks.length === 0) {
                    showToast('未找到有效的书签数据', 'error');
                    return; // 失败时不关闭窗口
                }
                
                // 确认导入
                customConfirm(`${t('confirmImport')} ${bookmarks.length} ${t('bookmarks')}？${t('willMergeWithExisting')}`, async (confirmed) => {
                    if (!confirmed) {
                        // 用户取消，不关闭窗口，让用户可以继续操作
                        return;
                    }
                    
                    // 用户确认后，关闭导入对话框
                    closeImportTypeModal();
                    
                    // 逐个添加到指定选项卡
                    let addedCount = 0;
                    let failedCount = 0;
                    
                    for (const bookmark of bookmarks) {
                        try {
                            const response = await fetch('/api/add', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    name: bookmark.name,
                                    url: bookmark.url,
                                    tabId: targetTabId
                                })
                            });
                            
                            const result = await response.json();
                            if (result.code === 0) {
                                addedCount++;
                            } else {
                                failedCount++;
                                console.warn('Failed to add bookmark:', bookmark.name, result.message);
                            }
                        } catch (err) {
                            console.error('Failed to add bookmark:', bookmark.name, err);
                            failedCount++;
                        }
                    }
                    
                    showToast(`${t('importComplete')}${addedCount}${t('skipDuplicate')}${failedCount}`, 'success');
                    
                    // 重新加载当前选项卡的数据
                    await loadLinks();
                });
            } catch (error) {
                console.error('Parse HTML error:', error);
                showToast('解析 HTML 失败：' + error.message, 'error');
                // 失败时不关闭窗口，让用户可以修改内容后重试
            }
        }
        
        // 解析 Chrome/Edge 书签 HTML 文件
        function parseChromeBookmarks(htmlContent) {
            const bookmarks = [];
            
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                
                // 查找所有 <A> 标签，不仅限于 dt > a
                const links = doc.querySelectorAll('a[href]');
                console.log('Found', links.length, 'link elements in HTML');
                
                links.forEach((link, index) => {
                    const href = link.getAttribute('href');
                    const title = link.textContent.trim();
                    
                    // 只处理 http/https 链接，跳过 file:// 等特殊协议
                    if (href && (href.startsWith('http://') || href.startsWith('https://')) && title) {
                        bookmarks.push({
                            name: title,
                            url: href
                        });
                        if (index < 3) {
                            console.log('Parsed bookmark:', title, href);
                        }
                    }
                });
            } catch (parseError) {
                console.error('Error parsing HTML:', parseError);
            }
            
            return bookmarks;
        }
