<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <title>我的收藏夹</title>
</head>
<body>
    <div class="add-box">
        <div style="display: flex;flex-direction: column;width: 100%;gap: 10px;">
            <!-- 上方：图标大小选择、标题和操作按钮 -->
            <div style="display: flex;justify-content: space-between;align-items: center;width: 100%;gap: 15px;">
                <!-- 左侧：图标大小选择 -->
                <div class="icon-size-buttons" style="margin: 0;">
                    <button class="icon-size-btn" id="btnLarge" onclick="setIconSize('large')" data-i18n="largeIcon">大图标</button>
                    <button class="icon-size-btn" id="btnMedium" onclick="setIconSize('medium')" data-i18n="mediumIcon">中图标</button>
                    <button class="icon-size-btn" id="btnSmall" onclick="setIconSize('small')" data-i18n="smallIcon">小图标</button>
                </div>
                
                <!-- 中间：标题 -->
                <h2 class="title" id="toolbarTitle" ondblclick="startEditTitle()" data-i18n="pageTitle" style="font-size: 20px;margin: 0;cursor: pointer;padding: 8px 15px;border-radius: 6px;transition: background 0.3s;color: #2d3748;">我的收藏夹</h2>
                <input type="text" class="title-edit" id="toolbarTitleEdit" onblur="saveTitle()" onkeypress="if(event.key==='Enter') saveTitle()" style="font-size: 20px;padding: 8px 15px;">
                
                <!-- 右侧：操作按钮 -->
                <div style="display: flex;gap: 10px;flex-shrink: 0;">
                    <button onclick="openAddModal()" style="flex: 0 0 auto;" data-i18n="addBookmark">添加收藏</button>
                    <button onclick="openSettingsModal()" style="background: #718096;" data-i18n="settings">⚙ 设置</button>
                    <button onclick="exportData()" style="background: #805ad5;" data-i18n="exportData">导出数据</button>
                    <button onclick="document.getElementById('importFile').click()" style="background: #38b2ac;" data-i18n="importData">导入数据</button>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
                </div>
            </div>
            
            <!-- 下方：语言切换 -->
            <div style="display: flex;justify-content: flex-end;">
                <!-- Language Switcher - Text style -->
                <div class="language-switcher-text">
                    <span class="lang-text" id="langZh" onclick="setLanguage('zh')">中文</span>
                    <span class="lang-separator">|</span>
                    <span class="lang-text" id="langEn" onclick="setLanguage('en')">English</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Tab Container -->
    <div class="tab-container">
        <div class="tab-header" id="tabHeader"></div>
    </div>
    
    <div class="link-grid" id="linkList">
        <div class="empty" data-i18n="noBookmarks">暂无收藏</div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3 data-i18n="editBookmark">编辑收藏</h3>
            <input type="text" class="modal-input" id="editName" placeholder="网址名称（可为空）" data-i18n-placeholder="bookmarkNamePlaceholder">
            <input type="url" class="modal-input" id="editUrl" placeholder="完整网址 https://" data-i18n-placeholder="fullUrlPlaceholder">
            <input type="text" class="modal-input" id="editNote" placeholder="说明" data-i18n-placeholder="notePlaceholder" style="margin-bottom: 0;">
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeEditModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" onclick="saveEdit()" data-i18n="save">保存</button>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h3 data-i18n="addBookmark">添加收藏</h3>
            <input type="text" class="modal-input" id="addName" placeholder="网址名称（可为空，将自动提取）" data-i18n-placeholder="bookmarkNameAutoPlaceholder">
            <input type="url" class="modal-input" id="addUrl" placeholder="完整网址 https://" oninput="autoFillName()" data-i18n-placeholder="fullUrlPlaceholder">
            <input type="text" class="modal-input" id="addNote" placeholder="说明" data-i18n-placeholder="notePlaceholder" style="margin-bottom: 0;">
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeAddModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" onclick="saveAddLink()" data-i18n="add">添加</button>
            </div>
        </div>
    </div>

    <!-- Move to Tab Modal -->
    <div class="modal-overlay" id="moveToTabModal">
        <div class="modal">
            <h3 data-i18n="moveToTab">移动到目标选项卡</h3>
            <select class="modal-input" id="targetTabSelect"></select>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeMoveToTabModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" onclick="confirmMoveToTab()" data-i18n="confirm">确定</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>⚙ <span data-i18n="settings">系统设置</span></h3>
            <div style="margin-bottom: 15px;">
                <label style="display: block;margin-bottom: 5px;color: #4a5568;font-weight: bold;" data-i18n="portNumber">端口号：</label>
                <input type="number" class="modal-input" id="settingPort" placeholder="8080" min="1" max="65535" style="margin-bottom: 5px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block;margin-bottom: 5px;color: #4a5568;font-weight: bold;" data-i18n="copyright">版权信息：</label>
                <input type="text" class="modal-input" id="settingCopyright" placeholder="(c) DSH - MyBookmark" style="margin-bottom: 0;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: flex;align-items: center;gap: 10px;cursor: pointer;">
                    <input type="checkbox" id="settingDebug" style="width: auto;margin: 0;">
                    <span style="color: #4a5568;" data-i18n="debugMode">开启调试模式</span>
                </label>
            </div>
            <div style="background: #fffbeb;border-left: 4px solid #f59e0b;padding: 12px;margin-bottom: 20px;border-radius: 4px;">
                <p style="color: #92400e;font-size: 13px;margin: 0;" data-i18n="restartRequired">
                    ⚠️ <strong>注意：</strong>如果修改了端口，需要重启服务后才能生效。
                </p>
            </div>
            <div style="text-align: center;margin-bottom: 15px;display: flex;justify-content: center;gap: 20px;">
                <a href="https://gitee.com/dongatsh/dsh-mybookmark/" target="_blank" style="color: #4299e1;text-decoration: none;font-size: 14px;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
                    Gitee
                </a>
                |
                <a href="https://gitee.com/dongatsh/dsh-mybookmark/issues" target="_blank" style="color: #4299e1;text-decoration: none;font-size: 14px;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
                    Issue
                </a>
            </div>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeSettingsModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" onclick="saveSettings()" data-i18n="save">保存</button>
            </div>
            <div style="text-align: center;margin-top: 15px;color: #a0aec0;font-size: 12px;">
                <span id="settingVersion">v1.0.0</span>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <h3 data-i18n="exportData">导出数据</h3>
            <div style="margin-bottom: 15px;">
                <label style="display: block;margin-bottom: 8px;color: #4a5568;font-weight: bold;" data-i18n="exportScopeLabel">选择导出范围：</label>
                <select class="modal-input" id="exportScopeSelect">
                    <option value="all" data-i18n="exportAllOption">全部数据（包含所有选项卡和标题）</option>
                </select>
            </div>
            <div style="background: #ebf8ff;border-left: 4px solid #4299e1;padding: 12px;margin-bottom: 20px;border-radius: 4px;">
                <p style="color: #2b6cb0;font-size: 13px;margin: 0;" data-i18n="exportTip">
                    💡 <strong>提示：</strong>选择"全部数据"将导出标题、所有选项卡及其内容；选择单个选项卡仅导出该选项卡的站点。
                </p>
            </div>
            <div class="modal-buttons">
                <button class="cancel-btn" onclick="closeExportModal()" data-i18n="cancel">取消</button>
                <button class="save-btn" onclick="confirmExport()" data-i18n="exportData">导出</button>
            </div>
        </div>
    </div>

                restartRequired: '⚠️ 注意：如果修改了端口，需要重启服务后才能生效。',
                configSaved: '配置保存成功！如果修改了端口，请重启服务。',
                configSaveFailed: '保存配置失败：',
                getConfigFailed: '获取配置失败',

                exportSingleOption: '{name} ({count}个站点)',
                exportTip: '💡 提示：选择"全部数据"将导出标题、所有选项卡及其内容；选择单个选项卡仅导出该选项卡的站点。',
                moveToOtherTab: '移动到其它选项卡',

            },

                pageTitle: 'My Bookmarks',
                defaultTitle: 'My Bookmarks',

                mediumIcon: 'Medium',
                smallIcon: 'Small',

                exportData: 'Export',
                importData: 'Import',
                noBookmarks: 'No bookmarks yet, add your first one',
                editBookmark: 'Edit Bookmark',
                bookmarkNamePlaceholder: 'Website name (optional)',
                bookmarkNameAutoPlaceholder: 'Website name (optional, auto-extracted)',
                fullUrlPlaceholder: 'Full URL https://',
                notePlaceholder: 'Note',
                cancel: 'Cancel',
                save: 'Save',
                add: 'Add',
                moveToTab: 'Move to Tab',
                confirm: 'OK',
                prompt: 'Prompt',
                deleteConfirm: 'Are you sure to delete?',
                fillNameAndUrl: 'Please fill in name and URL',
                fillUrl: 'Please fill in URL',
                cannotExtractName: 'Cannot extract website name, please enter manually',
                addSuccess: 'Added successfully',
                addFailed: 'Add failed: ',
                deleteSuccess: 'Deleted successfully',
                saveSuccess: 'Saved successfully',
                saveFailed: 'Save failed: ',
                saveError: 'Error occurred while saving: ',
                iconSizeChanged: 'Icon size changed',
                changeIconSizeFailed: 'Failed to change icon size',
                exportSuccess: 'Data exported successfully',
                exportFailed: 'Export failed: ',
                importSuccess: 'Import successful!',
                importComplete: 'Import completed!\nAdded: ',
                skipDuplicate: ' \nSkipped duplicates: ',
                importFailed: 'Import failed: ',
                invalidFileFormat: 'Invalid or corrupted file format',
                tabNameCannotEmpty: 'Tab name cannot be empty',
                addTabSuccess: 'Tab added successfully',
                addTabFailed: 'Failed to add tab',
                deleteTabSuccess: 'Tab deleted successfully',
                deleteTabFailed: 'Failed to delete tab',
                updateTabNameFailed: 'Failed to update tab name',
                moveFailed: 'Move failed',
                moveLinkError: 'Move failed: ',
                noOtherTab: 'No other tabs to move to',
                enterTabName: 'Enter tab name:',
                unknownError: 'Unknown error',
                confirmImport: 'Are you sure to import',
                bookmarks: 'bookmarks?',
                willMergeWithExisting: 'This will merge with existing data.',
                confirmDeleteTab: 'Are you sure to delete this tab?',
                addTabButton: ' ',
                openButton: 'Open',
                editButton: 'Edit',
                deleteButton: 'Delete',
                doubleClickToEdit: 'Double-click to edit name',
                sitesCount: ' sites',
                atLeastOneTab: 'At least one tab must be kept',
                tabHasLinks: 'This tab has {count} sites, please clear them first',
                settings: 'Settings',
                copyright: 'Copyright',
                portNumber: 'Port Number',
                debugMode: 'Enable Debug Mode',
                restartRequired: '⚠️ Note: If you change the port, you need to restart the service for it to take effect.',
                configSaved: 'Configuration saved! If you changed the port, please restart the service.',
                configSaveFailed: 'Failed to save configuration: ',
                getConfigFailed: 'Failed to get configuration',
                enterPort: 'Please enter port number',
                invalidPort: 'Port number must be between 1-65535',
                exportScopeLabel: 'Select Export Scope:',
                exportAllOption: 'All Data (includes all tabs and title)',
                exportSingleOption: '{name} ({count} sites)',
                exportTip: '💡 Tip: Select "All Data" to export title, all tabs and their content; select a single tab to export only that tab\'s sites.',
                moveToOtherTab: 'Move to Other Tab',
                refreshIcon: 'Refresh Icon'
            }
        };
        
        let currentLanguage = localStorage.getItem('language') || 'zh';
        
        // 设置语言
        function setLanguage(lang) {
            currentLanguage = lang;
            localStorage.setItem('language', lang);
            applyLanguage();
        }
        
        // 应用语言
        function applyLanguage() {
            const texts = i18n[currentLanguage];
            
            // 更新所有带有 data-i18n 属性的元素
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (texts[key]) {
                    el.textContent = texts[key];
                }
            });
            
            // 更新所有带有 data-i18n-placeholder 属性的元素
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (texts[key]) {
                    el.placeholder = texts[key];
                }
            });
            
            // 更新语言文本状态
            const langZh = document.getElementById('langZh');
            const langEn = document.getElementById('langEn');
            if (langZh) langZh.classList.toggle('active', currentLanguage === 'zh');
            if (langEn) langEn.classList.toggle('active', currentLanguage === 'en');
            
            // 重新加载页面以应用所有更改
            loadLinks();
            loadTabs();
        }
        
        // 获取翻译文本
        function t(key, params = {}) {
            let text = i18n[currentLanguage][key] || key;
            // 替换模板中的占位符 {paramName}
            Object.keys(params).forEach(param => {
                text = text.replace(`{${param}}`, params[param]);
            });
            return text;
        }
        
        // 页面加载读取数据
        window.onload = async function() {
            await loadConstants();
            loadTitle();
            loadTabs();
            loadLinks();
            applyLanguage(); // 应用语言设置
        };

        // 加载常量配置
        async function loadConstants() {
            try {
                console.log('Loading constants from API...');
                const response = await fetch('/api/getConstants');
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                console.log('API result:', result);
                
                if (result.code !== 0) {
                    throw new Error(result.message || 'Failed to get constants');
                }
                
                const constants = {
                    version: result.version,
                    copyright: result.copyright
                };
                console.log('Constants loaded:', constants);
                
                // 更新页脚版权信息
                const footer = document.querySelector('.footer');
                console.log('Footer element:', footer);
                
                if (footer && constants.version && constants.copyright) {
                    // 只显示版权信息，不显示版本号
                    footer.textContent = constants.copyright;
                    console.log('Footer updated');
                } else {
                    console.warn('Missing version or copyright in constants');
                }
            } catch (error) {
                console.error('Failed to load constants:', error);
                // 如果加载失败，使用默认值
                const footer = document.querySelector('.footer');
                if (footer) {
                    footer.textContent = '(c) DSH-MyBookmark v1.0.0';
                    console.log('Using default footer text');
                }
            }
        }

        let currentEditId = null;
        let draggedElement = null;
        let draggedLinkId = null; // 保存被拖动的站点 ID
        let currentIconSize = 'medium';
        let currentTabId = null;
        let draggedTabElement = null;
        let movingLinkId = null;
        let nextTabNumber = 2; // Tab 序号计数器
        let confirmCallback = null;
        let promptCallback = null;

        // 读取列表
        async function loadLinks() {
            const res = await fetch('/api/get');
            const data = await res.json();
            const list = data.links || [];
            currentIconSize = data.iconSize || 'medium';
            
            // 更新按钮状态
            updateIconSizeButtons();
            
            const el = document.getElementById('linkList');
            if (list.length === 0) {
                el.innerHTML = '<div class="empty" data-i18n="noBookmarks">' + t('noBookmarks') + '</div>';
                return;
            }
            let html = '';
            list.forEach(item => {
                const favicon = getFaviconUrl(item);
                console.log('Loading favicon for:', item.name, '(ID:', item.id, ')', '->', favicon);
                const iconClass = currentIconSize === 'small' ? 'small' : currentIconSize;
                const smallIconMode = currentIconSize === 'small' ? 'small-icon-mode' : '';
                const noIconClass = ''; // 不再使用 no-icon 类
                
                if (currentIconSize === 'small') {
                    // 小图标模式：横向布局
                    html += `
                    <div class="link-card ${smallIconMode}" draggable="true" data-id="${item.id}" 
                         ondragstart="handleDragStart(event)" 
                         ondragend="handleDragEnd(event)"
                         ondragover="handleDragOver(event)"
                         ondrop="handleDrop(event)">
                        <button class="move-btn-icon" onclick="showMoveToTabModal(${item.id})" title="${t('moveToOtherTab')}">⇄</button>
                        <button class="refresh-favicon-btn" onclick="refreshFavicon(${item.id})" title="${t('refreshIcon')}">⟳</button>
                        <div class="link-icon ${iconClass}" style="background-size: cover; background-position: center;">
                            <img src="${favicon}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'">
                        </div>
                        <div class="card-content">
                            <div class="link-name">${item.name}</div>
                            <div class="link-url"><a href="${item.url}" target="_blank">${item.url}</a></div>
                            ${item.note ? `<div class="link-note">${item.note}</div>` : ''}
                        </div>
                        <div class="card-actions">
                            <button class="card-btn open-btn" onclick="window.open('${item.url}','_blank')">${t('openButton')}</button>
                            <button class="card-btn edit-btn" onclick="openEditModal(${item.id})">${t('editButton')}</button>
                            <button class="card-btn del-btn" onclick="delLink(${item.id})">${t('deleteButton')}</button>
                        </div>
                    </div>`;
                } else {
                    // 大/中图标模式：纵向布局
                    html += `
                    <div class="link-card" draggable="true" data-id="${item.id}" 
                         ondragstart="handleDragStart(event)" 
                         ondragend="handleDragEnd(event)"
                         ondragover="handleDragOver(event)"
                         ondrop="handleDrop(event)">
                        <button class="move-btn-icon" onclick="showMoveToTabModal(${item.id})" title="${t('moveToOtherTab')}">⇄</button>
                        <button class="refresh-favicon-btn" onclick="refreshFavicon(${item.id})" title="${t('refreshIcon')}">⟳</button>
                        <div class="link-icon ${iconClass}" style="background-size: cover; background-position: center;">
                            <img src="${favicon}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'">
                        </div>
                        <div class="link-name">${item.name}</div>
                        <div class="link-url"><a href="${item.url}" target="_blank">${item.url}</a></div>
                        ${item.note ? `<div class="link-note">${item.note}</div>` : ''}
                        <div class="card-actions">
                            <button class="card-btn open-btn" onclick="window.open('${item.url}','_blank')">${t('openButton')}</button>
                            <button class="card-btn edit-btn" onclick="openEditModal(${item.id})">${t('editButton')}</button>

        // 加载 Tabs
        async function loadTabs() {
            const res = await fetch('/api/get');
            const data = await res.json();
            let tabs = data.tabs || [{ id: Date.now(), name: '我的常用站点', links: [] }];
            
            // 根据当前语言转换默认 tab 名称
            tabs = tabs.map(tab => {
                if (tab.name === '我的常用站点' && currentLanguage === 'en') {
                    return { ...tab, name: t('defaultTabName') };
                } else if (tab.name === 'My Favorite Sites' && currentLanguage === 'zh') {
                    return { ...tab, name: t('defaultTabName') };
                }
                return tab;
            });
            
            // 如果没有当前选中的 tab，选中第一个
            if (!currentTabId && tabs.length > 0) {
                currentTabId = tabs[0].id;
            }
            
            // 从服务器获取当前tabId
            if (data.currentTabId) {
                currentTabId = data.currentTabId;
            }
            
            // 计算下一个 Tab 序号
            calculateNextTabNumber(tabs);
            
            renderTabs(tabs);
        }

        // 计算下一个 Tab 序号
        function calculateNextTabNumber(tabs) {
            let maxNum = 1;
            tabs.forEach(tab => {
                // 匹配中文格式：选项卡#数字
                const matchZh = tab.name.match(/^选项卡#(\d+)$/);
                // 匹配英文格式：Tab #数字
                const matchEn = tab.name.match(/^Tab #(\d+)$/);
                
                if (matchZh) {
                    const num = parseInt(matchZh[1]);
                    if (num > maxNum) {
                        maxNum = num;
                    }
                } else if (matchEn) {
                    const num = parseInt(matchEn[1]);
                    if (num > maxNum) {
                        maxNum = num;
                    }
                }
            });
            nextTabNumber = maxNum + 1;
        }

        // 渲染 Tabs
        function renderTabs(tabs) {
            const header = document.getElementById('tabHeader');
            let html = '';
            
            tabs.forEach((tab, index) => {
                const activeClass = tab.id === currentTabId ? 'active' : '';
                const activeIcon = tab.id === currentTabId ? '<span class="tab-active-icon">●</span>' : '';
                const closeBtn = tabs.length > 1 ? `<span class="tab-close" onclick="deleteTab(${tab.id}, event)">×</span>` : '';
                html += `
                    <div class="tab-item ${activeClass}" draggable="true" data-tab-id="${tab.id}"
                         ondragstart="handleTabDragStart(event)"
                         ondragend="handleTabDragEnd(event)"
                         ondragover="handleTabDragOver(event)"
                         ondrop="handleTabDrop(event)"
                         ondragenter="handleTabDragEnter(event)"
                         ondragleave="handleTabDragLeave(event)">
                        ${activeIcon}<span class="tab-name" id="tab-name-${tab.id}" title="${t('doubleClickToEdit')}">${tab.name}</span>
                        ${closeBtn}
                    </div>
                `;
            });
            
            html += `<button class="add-tab-btn" onclick="addTab()">+ ${t('addTabButton')}</button>`;
            header.innerHTML = html;
            
            // 为每个 Tab 绑定事件
            tabs.forEach(tab => {
                const tabElement = document.querySelector(`.tab-item[data-tab-id="${tab.id}"]`);
                const nameElement = document.getElementById(`tab-name-${tab.id}`);
                
                if (tabElement && nameElement) {
                    let clickTimer = null;
                    
                    // 使用延迟处理单击/双击
                    tabElement.addEventListener('click', function(e) {
                        if (e.target.classList.contains('tab-close')) return;
                        
                        if (clickTimer) {
                            // 已经有一次点击，这是双击
                            clearTimeout(clickTimer);
                            clickTimer = null;
                            e.stopPropagation();
                            startEditTabName(tab.id, nameElement);
                        } else {
                            // 第一次点击，等待看是否有第二次点击
                            clickTimer = setTimeout(() => {
                                clickTimer = null;
                                switchTab(tab.id);
                            }, 250); // 250ms 内再次点击算双击
                        }
                    });
                }
            });
        }

        // 开始编辑 Tab 名称
        function startEditTabName(tabId, element) {
            const currentName = element.textContent;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'tab-name-input';
            input.value = currentName;
            
            // 阻止事件冒泡，避免触发 Tab 切换
            input.addEventListener('click', (e) => e.stopPropagation());
            input.addEventListener('dblclick', (e) => e.stopPropagation());
            
            element.replaceWith(input);
            input.focus();
            input.select();
            
            // 失去焦点或按回车时保存
            const saveEdit = () => {
                const newName = input.value.trim();
                if (newName && newName !== currentName) {
                    updateTabName(tabId, newName);
                } else if (!newName) {
                    // 如果名称为空，恢复原名称
                    showToast(t('tabNameCannotEmpty'), 'warning');
                    input.replaceWith(createTabNameElement(currentName, tabId));
                } else {
                    // 名称未改变，恢复原样
                    input.replaceWith(createTabNameElement(currentName, tabId));
                }
            };
            
            input.addEventListener('blur', saveEdit);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    saveEdit();
                }
            });
            
            // 按ESC取消
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    input.replaceWith(createTabNameElement(currentName, tabId));
                }
            });
        }

        // 创建 Tab 名称元素
        function createTabNameElement(name, tabId) {
            const span = document.createElement('span');
            span.className = 'tab-name';
            span.textContent = name;
            span.setAttribute('ondblclick', `startEditTabName(${tabId}, this)`);
            return span;
        }

        // 添加 Tab
        async function addTab() {
            const res = await fetch('/api/get');
            const data = await res.json();
            const tabs = data.tabs || [];
            
            // 检查是否已达到最大数量
            if (tabs.length >= 5) {
                showToast('最多只能创建5个选项卡', 'warning');
                return;
            }
            
            // 使用递增的序号作为默认名称，根据语言显示
            const defaultName = currentLanguage === 'zh' ? `选项卡#${nextTabNumber}` : `Tab #${nextTabNumber}`;
            
            customPrompt(t('enterTabName'), defaultName, async (name) => {
                if (!name || !name.trim()) return;
                
                try {
                    const response = await fetch('/api/addTab', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: name.trim() })
                    });
                    
                    const result = await response.json();
                    
                    if (result.code === 0) {
                        // 如果使用的是默认名称，增加序号
                        const zhDefaultName = `选项卡#${nextTabNumber}`;
                        const enDefaultName = `Tab #${nextTabNumber}`;
                        if (name.trim() === zhDefaultName || name.trim() === enDefaultName) {
                            nextTabNumber++;
                        } else {
                            // 如果用户自定义了名称，重新计算序号
                            const res = await fetch('/api/get');
                            const data = await res.json();
                            calculateNextTabNumber(data.tabs || []);
                        }
                        
                        // 切换到新 Tab
                        if (result.tabId) {
                            currentTabId = result.tabId;
                        }
                        
                        // 重新加载 Tabs 和 Links
                        await loadTabs();
                        await loadLinks();
                        showToast(t('addTabSuccess'), 'success');
                    } else {
                        showToast(result.message || t('addTabFailed'), 'error');
                    }
                } catch (error) {
                    console.error('Add tab error:', error);
                    showToast(t('addTabFailed'), 'error');
                }
            });
        }

        // 删除 Tab
        async function deleteTab(tabId, event) {
            event.stopPropagation();
            
            customConfirm(t('confirmDeleteTab'), async (confirmed) => {
                if (!confirmed) return;
                
                try {
                    const res = await fetch('/api/deleteTab', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tabId })
                    });
                    const result = await res.json();
                    
                    if (result.code === 0) {
                        loadTabs();
                        loadLinks();
                        showToast(t('deleteTabSuccess'), 'success');
                    } else {
                        // 如果服务器返回了 messageKey，使用翻译；否则使用 message 或默认错误消息
                        let errorMessage;
                        if (result.messageKey) {
                            // 如果有额外的参数，传递给翻译函数
                            const params = result.linkCount !== undefined ? { count: result.linkCount } : {};
                            errorMessage = t(result.messageKey, params);
                        } else {
                            errorMessage = result.message || t('deleteTabFailed');
                        }
                        showToast(errorMessage, 'error');
                    }
                } catch (error) {
                    console.error('Delete tab error:', error);
                    showToast(t('deleteTabFailed'), 'error');
                }
            });

        // Tab 拖拽功能
        function handleTabDragStart(event) {
            draggedTabElement = event.target.closest('.tab-item');
            if (!draggedTabElement) return;
            draggedTabElement.classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
        }

        function handleTabDragEnd(event) {
            if (draggedTabElement) {
                draggedTabElement.classList.remove('dragging');
                document.querySelectorAll('.tab-item').forEach(tab => {
                    tab.classList.remove('drag-over');
                });
                draggedTabElement = null;
            }
        }

        function handleTabDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            const tab = event.target.closest('.tab-item');
            if (tab && tab !== draggedTabElement) {
                tab.classList.add('drag-over');
            }
        }

        // 拖动进入选项卡
        function handleTabDragEnter(event) {
            event.preventDefault();
            const tab = event.target.closest('.tab-item');
            if (tab && draggedLinkId) {
                // 如果拖动的是站点卡片，高亮选项卡
                tab.style.background = '#bee3f8';
            }
        }

        // 拖动离开选项卡
        function handleTabDragLeave(event) {
            const tab = event.target.closest('.tab-item');
            if (tab) {
                tab.style.background = '';
            }
        }

        async function handleTabDrop(event) {
            event.preventDefault();
            const targetTab = event.target.closest('.tab-item');
            
            // 重置样式
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.style.background = '';
            });
            
            if (!targetTab) {
                return;
            }
            
            const targetTabId = parseInt(targetTab.dataset.tabId);
            
            // 如果拖动的是站点卡片
            if (draggedLinkId) {
                // 不能移动到当前选项卡
                if (targetTabId === currentTabId) {
                    draggedLinkId = null;
                    return;
                }
                
                try {
                    const response = await fetch('/api/moveLinkToTab', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            linkId: draggedLinkId,
                            fromTabId: currentTabId,
                            toTabId: targetTabId
                        })
                    });
                    
                    const result = await response.json();
                    if (result.code === 0) {
                        showToast('站点已移动', 'success');
                        loadLinks();
                        loadTabs();
                    } else {
                        showToast(result.message || '移动失败', 'error');
                    }
                } catch (error) {
                    console.error('Move link error:', error);
                    showToast('移动失败：' + error.message, 'error');
                }
                
                draggedLinkId = null;
                return;
            }
            
            // 如果拖动的是选项卡（原有的逻辑）
            if (!draggedTabElement || targetTab === draggedTabElement) {
                return;
            }

            const header = document.getElementById('tabHeader');
            const tabs = Array.from(header.querySelectorAll('.tab-item'));
            
            const draggedIndex = tabs.indexOf(draggedTabElement);
            const targetIndex = tabs.indexOf(targetTab);

            if (draggedIndex === -1 || targetIndex === -1) {
                return;
            }

            // 重新排列DOM元素
            if (draggedIndex < targetIndex) {
                header.insertBefore(draggedTabElement, targetTab.nextSibling);
            } else {
                header.insertBefore(draggedTabElement, targetTab);
            }

            // 获取新的顺序并保存到服务器
            const newOrderTabs = Array.from(header.querySelectorAll('.tab-item'));
            const tabIds = newOrderTabs.map(tab => parseInt(tab.dataset.tabId));
            
            try {
                await fetch('/api/updateTabOrder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tabIds })
                });
                console.log('Tab order saved');
            } catch (error) {
                console.error('Save tab order error:', error);
                loadTabs();
            }
        }

        // 自动填充名称
        async function autoFillName() {
            const url = document.getElementById('addUrl').value.trim();
            const nameInput = document.getElementById('addName');
            // 只有当名称为空时才自动填充
            if (url && !nameInput.value.trim()) {

                const extractedName = extractNameFromUrl(url);
                if (extractedName) {
                    nameInput.value = extractedName;
                }
            }

        // 确保URL有协议前缀
        function ensureUrlProtocol(url) {
            if (!url) return url;
            const trimmed = url.trim();
            // 如果已经有协议前缀，直接返回
            if (/^https?:\/\//i.test(trimmed)) {
                return trimmed;
            }
            // 如果没有协议，添加 https://
            return 'https://' + trimmed;
        }

        // 保存添加的链接
        async function saveAddLink() {
            let name = document.getElementById('addName').value.trim();
            let url = document.getElementById('addUrl').value.trim();
            const note = document.getElementById('addNote').value.trim();
            
            if (!url) {
                showToast(t('fillUrl'), 'warning');
                return;
            }
            
            // 确保URL有协议
            url = ensureUrlProtocol(url);
            
            // 如果名称为空，自动从 URL 提取
            if (!name) {
                name = extractNameFromUrl(url);
            }
            
            if (!name) {
                showToast(t('cannotExtractName'), 'warning');
                return;
            }
            
            try {
                await fetch('/api/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, url, note })
                });
                closeAddModal();
                loadLinks();
                showToast(t('addSuccess'), 'success');

                console.error('Add link error:', error);
                showToast(t('addFailed') + error.message, 'error');

        // 获取网站favicon - 使用 ID 作为参数，添加时间戳避免缓存
        function getFaviconUrl(item) {
            try {
                // 返回 API 地址，使用 tabId 和 linkId 作为参数，添加时间戳
                const timestamp = Date.now();
                const faviconUrl = `/api/favicon/${currentTabId}/${item.id}?_ts=${timestamp}`;
                console.log('Favicon URL for', item.name, '(ID:', item.id, '):', faviconUrl);
                return faviconUrl;
            } catch (e) {
                console.error('Error generating favicon URL:', e);
                return '/website.png';
            }
        }

        // 检查是否有favicon
        function hasFavicon(url) {
            return url && url.length > 0;
        }

        // 从 URL 提取网站名称
        function extractNameFromUrl(url) {
            try {
                const urlObj = new URL(url);
                const hostname = urlObj.hostname;
                // 去除 www. 前缀
                const name = hostname.replace(/^www\./, '');
                // 取第一个部分作为名称
                const parts = name.split('.');
                return parts[0] || name;
            } catch {
                return '';
            }
        }

                // 移除所有drag-over类
                document.querySelectorAll('.link-card').forEach(card => {
                    card.classList.remove('drag-over');
                });
                draggedElement = null;
                draggedLinkId = null;
            }
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            const card = event.target.closest('.link-card');
            if (card && card !== draggedElement) {
                card.classList.add('drag-over');
            }
        }

        async function handleDrop(event) {
            event.preventDefault();
            const targetCard = event.target.closest('.link-card');
            
            if (!targetCard || !draggedElement || targetCard === draggedElement) {
                return;
            }

            // 获取所有卡片的ID顺序
            const grid = document.getElementById('linkList');
            const cards = Array.from(grid.querySelectorAll('.link-card'));
            
            // 找到拖动元素和目标元素的位置
            const draggedIndex = cards.indexOf(draggedElement);
            const targetIndex = cards.indexOf(targetCard);

            if (draggedIndex === -1 || targetIndex === -1) {
                return;
            }

            // 重新排列DOM元素
            if (draggedIndex < targetIndex) {
                grid.insertBefore(draggedElement, targetCard.nextSibling);
            } else {
                grid.insertBefore(draggedElement, targetCard);
            }

            // 获取新的顺序并保存到服务器
            const newOrderCards = Array.from(grid.querySelectorAll('.link-card'));
            const linkIds = newOrderCards.map(card => parseInt(card.dataset.id));
            
            try {
                await fetch('/api/updateOrder', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ linkIds })
                });
                console.log('Order saved to server');
            } catch (error) {
                console.error('Save order error:', error);
                // 如果保存失败，重新加载列表恢复原状
                loadLinks();
            }
        }

        // 设置图标大小
        async function setIconSize(size) {
            currentIconSize = size;
            
            try {
                await fetch('/api/updateIconSize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ iconSize: size })
                });
                console.log('Icon size changed to:', size);
                updateIconSizeButtons();
                loadLinks(); // 重新加载以应用新样式
                showToast(t('iconSizeChanged'), 'success');
            } catch (error) {
                console.error('Change icon size error:', error);
                showToast(t('changeIconSizeFailed'), 'error');
            }
        }

        // 更新图标大小按钮状态
        function updateIconSizeButtons() {
            // 移除所有按钮的active类
            document.querySelectorAll('.icon-size-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 给当前选中的按钮添加active类
            const activeBtnId = 'btn' + currentIconSize.charAt(0).toUpperCase() + currentIconSize.slice(1);
            const activeBtn = document.getElementById(activeBtnId);
            if (activeBtn) {
                activeBtn.classList.add('active');
            }
        }

        // 导出数据 - 打开选择框
        async function exportData() {
            try {
                const res = await fetch('/api/get');
                const data = await res.json();
                const tabs = data.tabs || [];
                
                // 填充选项卡列表
                const select = document.getElementById('exportScopeSelect');
                select.innerHTML = `<option value="all" data-i18n="exportAllOption">${t('exportAllOption')}</option>`;
                
                tabs.forEach(tab => {
                    const option = document.createElement('option');
                    option.value = tab.id;
                    const siteCount = tab.links ? tab.links.length : 0;
                    option.textContent = t('exportSingleOption', { name: tab.name, count: siteCount });
                    select.appendChild(option);
                });
                
                document.getElementById('exportModal').style.display = 'flex';
            } catch (error) {
                console.error('Get data error:', error);
                showToast('获取数据失败', 'error');
            }
        }

        // 关闭导出弹窗
        function closeExportModal() {
            document.getElementById('exportModal').style.display = 'none';
        }

        // 确认导出
        async function confirmExport() {
            const scope = document.getElementById('exportScopeSelect').value;
            
            try {
                const res = await fetch('/api/get');
                const data = await res.json();
                
                let exportData;
                let filename;
                
                if (scope === 'all') {
                    // 导出全部数据，包含 config.json
                    const configRes = await fetch('/api/getConfig');
                    const configData = await configRes.json();
                    
                    exportData = {
                        ...data,
                        config: {
                            port: configData.port,
                            copyright: configData.copyright
                        }
                    };
                    filename = `mybookmark_full_backup_${new Date().getTime()}.json`;
                } else {
                    // 导出单个选项卡
                    const tabId = parseInt(scope);
                    const selectedTab = data.tabs.find(t => t.id === tabId);
                    
                    if (!selectedTab) {
                        showToast('未找到选中的选项卡', 'error');
                        return;
                    }
                    
                    // 只包含该选项卡的内容，不包含 title、iconSize、currentTabId
                    exportData = {
                        tabs: [selectedTab]
                    };
                    filename = `mybookmark_${selectedTab.name}_${new Date().getTime()}.json`;
                }
                
                // 创建JSON文件
                const jsonStr = JSON.stringify(exportData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                // 创建下载链接
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                closeExportModal();
                console.log('Data exported successfully');
                showToast(t('exportSuccess'), 'success');
            } catch (error) {
                console.error('Export error:', error);
                showToast(t('exportFailed') + error.message, 'error');
            }
        }

        // 导入数据
        async function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            try {
                const text = await file.text();
                const data = JSON.parse(text);
                
                // 计算要导入的项目数量
                let itemCount = 0;
                if (data.tabs && Array.isArray(data.tabs)) {
                    // 新格式：统计所有tabs中的links总数
                    data.tabs.forEach(tab => {
                        if (tab.links && Array.isArray(tab.links)) {
                            itemCount += tab.links.length;
                        }
                    });
                } else if (data.links && Array.isArray(data.links)) {
                    // 旧格式：直接统计links数量
                    itemCount = data.links.length;
                }
                
                // 确认导入
                customConfirm(`${t('confirmImport')} ${itemCount} ${t('bookmarks')}？${t('willMergeWithExisting')}`, async (confirmed) => {
                    if (!confirmed) {
                        event.target.value = ''; // 清空文件选择
                        return;
                    }
                
                // 如果包含 config，先保存配置
                if (data.config) {
                    try {
                        await fetch('/api/saveConfig', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                port: data.config.port,
                                copyright: data.config.copyright
                            })
                        });
                        console.log('Config imported successfully');
                    } catch (configError) {
                        console.error('Failed to import config:', configError);
                        // 配置导入失败不影响书签导入
                    }
                }
                
                const response = await fetch('/api/import', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.code === 0) {
                    let message = t('importSuccess');
                    if (result.added !== undefined && result.skipped !== undefined) {
                        message = t('importComplete') + result.added + t('skipDuplicate') + result.skipped + ' ';
                    } else if (result.message) {
                        message = result.message;
                    }
                    showToast(message, 'success');
                    // 重新加载整个页面数据（包括tabs和links）
                    await loadTabs();
                    await loadLinks();
                } else {
                    showToast(t('importFailed') + (result.message || t('unknownError')), 'error');
                }
                });
            } catch (error) {
                console.error('Import error:', error);
                showToast(t('importFailed') + t('invalidFileFormat'), 'error');
            }
            
            // 清空文件选择，允许重复导入同一文件
            event.target.value = '';
        }

        // 显示移动到Tab的弹窗
        async function showMoveToTabModal(linkId) {
            movingLinkId = linkId;
            const res = await fetch('/api/get');
            const data = await res.json();
            const tabs = data.tabs || [];
            
            const select = document.getElementById('targetTabSelect');
            select.innerHTML = '';
            
            tabs.forEach(tab => {
                if (tab.id !== currentTabId) { // 排除当前Tab
                    const option = document.createElement('option');
                    option.value = tab.id;
                    option.textContent = `${tab.name} (${tab.links ? tab.links.length : 0}${t('sitesCount')})`;
                    select.appendChild(option);
                }
            });
            
            if (tabs.length <= 1) {
                alert(t('noOtherTab'));
                return;
            }
            
            document.getElementById('moveToTabModal').style.display = 'flex';
        }

        // 关闭移动到Tab的弹窗
        function closeMoveToTabModal() {
            document.getElementById('moveToTabModal').style.display = 'none';
            movingLinkId = null;
        }

        // 确认移动到Tab
        async function confirmMoveToTab() {
            const targetTabId = parseInt(document.getElementById('targetTabSelect').value);
            if (!targetTabId || !movingLinkId) return;
            
            try {
                const response = await fetch('/api/moveLinkToTab', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        linkId: movingLinkId,
                        fromTabId: currentTabId,
                        toTabId: targetTabId
                    })
                });
                
                const result = await response.json();
                if (result.code === 0) {
                    closeMoveToTabModal();
                    loadLinks();
                    loadTabs();
                } else {
                    alert(result.message || t('moveFailed'));
                }
            } catch (error) {
                console.error('Move link error:', error);
                alert(t('moveLinkError') + error.message);
            }
        }

        // 打开设置弹窗
        async function openSettingsModal() {
            try {
                // 获取配置
                const configResponse = await fetch('/api/getConfig');
                const configResult = await configResponse.json();
                
                // 获取系统配置 (debug)
                const systemConfigResponse = await fetch('/api/getSystemConfig');
                const systemConfigResult = await systemConfigResponse.json();
                
                // 获取常量信息
                const constantsResponse = await fetch('/api/getConstants');
                const constantsResult = await constantsResponse.json();
                
                if (configResult.code === 0 && systemConfigResult.code === 0) {
                    document.getElementById('settingPort').value = configResult.port;
                    document.getElementById('settingDebug').checked = systemConfigResult.debug;
                    
                    // 显示版权信息到输入框
                    if (constantsResult.code === 0) {
                        document.getElementById('settingCopyright').value = constantsResult.copyright || '';
                        // 显示版本信息
                        document.getElementById('settingVersion').textContent = `v${constantsResult.version || '1.0.0'}`;
                    }
                    
                    document.getElementById('settingsModal').style.display = 'flex';
                } else {
                    showToast(t('getConfigFailed'), 'error');
                }
            } catch (error) {
                console.error('Get config error:', error);
                showToast(t('getConfigFailed') + '：' + error.message, 'error');
            }
        }

        // 关闭设置弹窗
        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        // 保存设置
        async function saveSettings() {
            const port = document.getElementById('settingPort').value.trim();
            const debug = document.getElementById('settingDebug').checked;
            const copyright = document.getElementById('settingCopyright').value.trim();
            
            if (!port) {
                showToast(t('enterPort'), 'warning');
                return;
            }
            
            const portNum = parseInt(port);
            if (isNaN(portNum) || portNum < 1 || portNum > 65535) {
                showToast(t('invalidPort'), 'warning');
                return;
            }
            
            try {
                // 保存 config.json 配置
                const configResponse = await fetch('/api/saveConfig', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ port: portNum, copyright: copyright })
                });
                
                const configResult = await configResponse.json();
                if (configResult.code !== 0) {
                    showToast(t('configSaveFailed') + (configResult.message || t('unknownError')), 'error');
                    return;
                }
                
                // 保存 system 配置 (debug)
                const systemConfigResponse = await fetch('/api/saveSystemConfig', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ debug: debug })
                });
                
                const systemConfigResult = await systemConfigResponse.json();
                if (systemConfigResult.code === 0) {
                    closeSettingsModal();
                    showToast(t('configSaved'), 'success', 5000);
                } else {
                    showToast(t('configSaveFailed') + (systemConfigResult.message || t('unknownError')), 'error');
                }
            } catch (error) {
                console.error('Save config error:', error);
                showToast(t('configSaveFailed') + error.message, 'error');
            }
        }

        // 刷新 Favicon
        async function refreshFavicon(linkId) {
            try {
                const response = await fetch('/api/refreshFavicon', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ linkId: linkId })
                });
                
                const result = await response.json();
                if (result.code === 0) {
                    showToast('图标刷新中，请稍后刷新页面查看', 'info', 3000);
                    // 延迟一下重新加载，给服务器时间下载
                    setTimeout(() => {
                        loadLinks();
                    }, 2000);
                } else {
                    showToast('刷新失败：' + (result.message || '未知错误'), 'error');
                }
            } catch (error) {
                console.error('Refresh favicon error:', error);
                showToast('刷新失败：' + error.message, 'error');
            }
        }
        
        // ==================== Custom Dialog Functions ====================
        
        // Toast 提示
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            // 添加图标
            const icons = {
                success: '✓',
                error: '✕',
                warning: '⚠',
                info: 'ℹ'
            };
            
            toast.innerHTML = `<span style="font-size: 18px;">${icons[type]}</span><span>${message}</span>`;
            container.appendChild(toast);
            
            // 自动消失
            setTimeout(() => {
                toast.classList.add('hiding');
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            }, duration);
        }
        
        // 自定义 Confirm
        function showConfirm(message, callback) {
            confirmCallback = callback;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmOverlay').style.display = 'flex';
        }
        
        function closeConfirm(result) {
            document.getElementById('confirmOverlay').style.display = 'none';
            if (confirmCallback) {
                confirmCallback(result);
                confirmCallback = null;
            }
        }
        
        // 自定义 Prompt
        function showPrompt(title, defaultValue, callback) {
            promptCallback = callback;
            document.getElementById('promptTitle').textContent = title;
            document.getElementById('promptInput').value = defaultValue || '';
            document.getElementById('promptOverlay').style.display = 'flex';
            
            // 自动聚焦并选中
            setTimeout(() => {
                const input = document.getElementById('promptInput');
                input.focus();
                input.select();
            }, 100);
        }
        
        function closePrompt(value) {
            document.getElementById('promptOverlay').style.display = 'none';
            if (promptCallback) {
                promptCallback(value);
                promptCallback = null;
            }
        }
        
        function closePromptWithInput() {
            const value = document.getElementById('promptInput').value;
            closePrompt(value);
        }
        
        // 重写系统函数
        window.customAlert = function(message) {
            showToast(message, 'info');
        };
        
        window.customConfirm = function(message, callback) {
            showConfirm(message, callback);
        };
        
        window.customPrompt = function(title, defaultValue, callback) {
            showPrompt(title, defaultValue, callback);
        };
    </script>
    
    <!-- Footer -->
    <div class="footer">
        Loading...
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Custom Confirm Dialog -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-dialog">
            <div class="confirm-message" id="confirmMessage"></div>
            <div class="confirm-buttons">
                <button class="confirm-btn confirm-cancel" onclick="closeConfirm(false)" data-i18n="cancel">取消</button>
                <button class="confirm-btn confirm-ok" onclick="closeConfirm(true)" data-i18n="confirm">确定</button>
            </div>
        </div>
    </div>
    
    <!-- Custom Prompt Dialog -->
    <div class="prompt-overlay" id="promptOverlay">
        <div class="prompt-dialog">
            <div class="prompt-title" id="promptTitle" data-i18n="prompt">提示</div>
            <input type="text" class="prompt-input" id="promptInput">
            <div class="confirm-buttons">
                <button class="confirm-btn confirm-cancel" onclick="closePrompt(null)" data-i18n="cancel">取消</button>
                <button class="confirm-btn confirm-ok" onclick="closePromptWithInput()" data-i18n="confirm">确定</button>
            </div>
        </div>
    </div>
</body>
</html>
